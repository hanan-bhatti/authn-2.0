openapi: 3.0.3
info:
  title: Authn Engine - Chunk Admin System OpenAPI Fragment
  version: 1.0.0
  description: OpenAPI 3.0 fragment covering API Keys, Impersonation & Policy, RBAC, Webhook endpoints, and the sandbox message inbox & delivery verification for apps/auth-engine.
paths:
  # ============================================================================
  # API Keys (internal/apikey/handler.go)
  # ============================================================================
  /v1/admin/keys:
    post:
      summary: Create API Key
      description: Issues a new API key (publishable or secret) for an application in the caller's tenant. The raw key is returned only once in this response.
      operationId: createApiKey
      tags:
        - API Keys (Admin)
      security:
        - SecretKey: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
      responses:
        '201':
          description: API key issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateKeyResponse'
        '400':
          description: Invalid request body, unsupported key type, application mismatch, or environment mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Code `test_quota_exceeded`. The tenant already holds TEST_MAX_API_KEYS
            keys in the test environment, counting the publishable/secret pair
            provisioning installs with each application. Live credentials are not
            bounded by this ceiling. Not 429 — waiting does not help, because the
            ceiling is on stored rows; room is made by revoking keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Named application not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      summary: List API Keys
      description: Returns metadata of all API keys belonging to an application in the tenant, including revoked and expired keys. Key secret material is never returned.
      operationId: listApiKeys
      tags:
        - API Keys (Admin)
      security:
        - SecretKey: []
        - BearerAuth: []
      parameters:
        - in: query
          name: application_id
          schema:
            type: string
          description: Application ID filter (required when caller uses a tenant-wide console JWT)
      responses:
        '200':
          description: List of API key metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyDTO'
        '400':
          description: Missing application_id for tenant-wide admin credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Named application not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/admin/keys/{id}/revoke:
    post:
      summary: Revoke API Key
      description: Marks an API key unusable. Revocation is confined to the caller's own tenant.
      operationId: revokeApiKey
      tags:
        - API Keys (Admin)
      security:
        - SecretKey: []
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Unique API Key ID identifier
      responses:
        '200':
          description: Key revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeKeyResponse'
        '400':
          description: Missing key ID, unknown key, or key already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ============================================================================
  # Impersonation & Policy (internal/impersonation/handler.go & internal/policy/handler.go)
  # ============================================================================
  /v1/admin/users/{user_id}/impersonate:
    post:
      summary: Initiate User Impersonation
      description: Initiates a user support session. When tenant policy demands step-up auth, verification parameters (password, totp, or passkey) must be satisfied.
      operationId: initiateImpersonation
      tags:
        - Impersonation (Admin)
      security:
        - SecretKey: []
        - BearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
          description: Unique target user ID to impersonate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpersonateRequest'
      responses:
        '200':
          description: Impersonation session token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationResult'
        '400':
          description: Missing user ID, invalid body, missing step-up credentials, user not active, or self-impersonation attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Failed step-up password/2FA verification or missing admin authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Impersonation disabled by policy, admin hierarchy violation, missing target opt-in, or missing users:impersonate scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target user not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation error against tenant impersonation policy limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/tenant/impersonation-policy:
    get:
      summary: Get Impersonation Policy
      description: Returns the tenant's current user impersonation governance policy settings.
      operationId: getImpersonationPolicy
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      responses:
        '200':
          description: Tenant impersonation policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationPolicy'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    put:
      summary: Update Impersonation Policy
      description: Updates and persists the tenant's user impersonation policy settings.
      operationId: updateImpersonationPolicy
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpersonationPolicy'
      responses:
        '200':
          description: Updated impersonation policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationPolicy'
        '400':
          description: Invalid request JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Policy validation failed (e.g. max_duration_minutes outside 1-60 or invalid email_notification_policy)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/client/auth/impersonate/exit:
    post:
      summary: Exit Impersonation Session
      description: Ends an active support impersonation session client-side and returns impersonator and target user IDs so the client can restore the admin session.
      operationId: exitImpersonation
      tags:
        - Impersonation (Client)
      security:
        - PublishableKey: []
        - BearerAuth: []
      responses:
        '200':
          description: Impersonation session exited successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExitImpersonationResponse'
        '400':
          description: Active session is not an impersonation session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing, invalid, or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/tenant/password-policy:
    get:
      summary: Get Password Policy
      description: >-
        Returns the password complexity requirements of one environment. Tenant and
        environment both come from the authenticating credential: a sk_test_ key reads the
        test policy and a sk_live_ key the live one, and neither can address the other. The
        environment is echoed in the response so a caller can tell which one it just read.
      operationId: getPasswordPolicy
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      responses:
        '200':
          description: Password policy of the credential's environment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PasswordPolicy'
                  - $ref: '#/components/schemas/EnvironmentEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      summary: Update Password Policy
      description: >-
        Configures the password complexity requirements of one environment. The write lands
        in the environment of the key that made it and nowhere else, so tightening the rule
        in test leaves live untouched until you either repeat the call with a live key or
        publish test onto live. environment is not accepted in the body; supplying it has no
        effect.
      operationId: updatePasswordPolicy
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicy'
      responses:
        '200':
          description: Updated password policy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PasswordPolicy'
                  - $ref: '#/components/schemas/EnvironmentEnvelope'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenant/security-policy:
    get:
      summary: Get Security Policy
      description: >-
        Returns one environment's security enforcement settings (email verification, token
        reuse policy). Tenant and environment both come from the authenticating credential.
      operationId: getSecurityPolicy
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      responses:
        '200':
          description: Security policy of the credential's environment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SecurityPolicy'
                  - $ref: '#/components/schemas/EnvironmentEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      summary: Update Security Policy
      description: >-
        Updates one environment's security enforcement settings. The write lands in the
        environment of the key that made it, so requiring verified email in test does not
        require it in live.
      operationId: updateSecurityPolicy
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityPolicy'
      responses:
        '200':
          description: Updated security policy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SecurityPolicy'
                  - $ref: '#/components/schemas/EnvironmentEnvelope'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenant/recovery-policy:
    get:
      summary: Get Recovery Policy
      description: >-
        Returns one environment's account recovery rules (proof methods, freeze windows,
        lockout schedule). Tenant and environment both come from the authenticating
        credential.
      operationId: getRecoveryPolicy
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      responses:
        '200':
          description: Recovery policy of the credential's environment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RecoveryPolicy'
                  - $ref: '#/components/schemas/EnvironmentEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      summary: Update Recovery Policy
      description: >-
        Configures one environment's account recovery rules. Policy bounds are strictly
        validated. The write lands in the environment of the key that made it, which is what
        makes these rules safe to experiment with: a freeze window that locks a test fixture
        out costs nothing, the same mistake in live locks out a customer.
      operationId: updateRecoveryPolicy
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryPolicy'
      responses:
        '200':
          description: Updated recovery policy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RecoveryPolicy'
                  - $ref: '#/components/schemas/EnvironmentEnvelope'
        '400':
          description: Invalid request body or recovery policy bounds rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenant/session-policy:
    get:
      summary: Get Session Policy
      description: >-
        Returns one environment's session and cookie settings — the refresh cookie's SameSite
        attribute and the access and refresh token lifetimes. A zero lifetime means the
        environment inherits the deployment default rather than that sessions expire
        instantly. Tenant and environment both come from the authenticating credential.
      operationId: getSessionPolicy
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      responses:
        '200':
          description: Session policy of the credential's environment
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SessionPolicy'
                  - $ref: '#/components/schemas/EnvironmentEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      summary: Update Session Policy
      description: >-
        Configures one environment's session and cookie settings. An access token lifetime
        off the menu is refused with 422: it is a fixed choice of 15, 30 or 60 minutes, so an
        unlisted number is a mistake to report rather than an approximation to fill in — a
        caller asking for 45 and being handed 30 has no way to notice. The refresh lifetime
        is still clamped into its window and an unrecognised cookie_same_site still becomes
        lax, so read the response rather than assuming the request applied verbatim. Whatever
        ends up stored still has to resolve to something usable, because it is read on the
        login path where there is no caller left to report a validation error to. The write
        lands in the environment of the key that made it.
      operationId: updateSessionPolicy
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionPolicy'
      responses:
        '200':
          description: Session policy as stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SessionPolicy'
                  - $ref: '#/components/schemas/EnvironmentEnvelope'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: >-
            access_token_ttl_minutes is not 15, 30 or 60. Code validation_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenant/settings:
    get:
      summary: Get All Settings For One Environment
      description: >-
        Returns every policy column of the credential's environment in one read, as stored.
        The typed per-policy endpoints above are the ones to configure against; this is for a
        console that needs to show what an environment currently holds. Each social
        provider's client secret is replaced by a client_secret_set boolean. A column that is
        absent or empty means nothing has been configured there and the engine's defaults
        apply.
      operationId: getTenantSettings
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      responses:
        '200':
          description: Stored settings of the credential's environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsResponse'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenant/settings/diff:
    get:
      summary: Compare Test And Live Settings
      description: >-
        Returns both environments' stored settings and the names of the columns that differ.
        This answers "what will change in live if I publish test", which is the question to
        ask before POST /v1/tenant/settings/publish. Both environments are returned whichever
        key authenticated the request, because comparing them is the whole point and reading
        across the boundary exposes nothing the same tenant does not already own. Secrets are
        redacted on both sides.
      operationId: getTenantSettingsDiff
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      responses:
        '200':
          description: Both environments' settings and the differing column names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsDiffResponse'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenant/settings/publish:
    post:
      summary: Publish One Environment's Settings Onto The Other
      description: >-
        Copies every policy column from one environment onto the other and records the
        promotion in the audit trail. This is what makes a separate test environment worth
        configuring: a policy is written in test, exercised against test sign-ins, and only
        then applied to live.

        The copy is wholesale rather than selective — all seven columns, not a chosen few —
        because a half-published configuration is a state nobody chose and nobody tested. It
        follows that publishing an empty source clears the destination, which is the faithful
        meaning of "make live match test"; call GET /v1/tenant/settings/diff first if you are
        unsure what that would do.

        The destination must be the environment of the key making the request, so promoting
        into live requires a sk_live_ key. Omitting the body means test to live.
      operationId: publishTenantSettings
      tags:
        - Policy (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishSettingsRequest'
      responses:
        '200':
          description: Settings published, with the names of the columns that changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishSettingsResponse'
        '400':
          description: >-
            Unparseable body, an environment name that is neither test nor live, or from and
            to naming the same environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            The key does not govern the destination — "publishing into live requires a live
            secret key". This is the guard that stops a test key overwriting a live
            configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  # ============================================================================
  # Sandbox Inbox & Delivery Verification (internal/sandbox/handler.go)
  # ============================================================================
  /v1/tenant/sandbox/messages:
    get:
      summary: List Captured Test-Environment Messages
      description: >-
        Returns one page of the messages the test environment captured instead of sending,
        newest first. In the test environment the engine does not deliver email or SMS at all:
        interception happens at the provider interface, so every message the engine sends is
        captured, including message types added later.

        The rendered body is omitted here and present only on a single-message read, because a
        listing carrying every rendered document would be tens of times larger than the fields
        anyone pages through an inbox for. The two values a test actually reads — code and
        metadata.link — are extracted at capture time and present either way, so completing a
        flow against the sandbox never means parsing HTML.

        total counts every message matching the filter before paging, which a test polling for
        a message cannot learn from the page length.
      operationId: listSandboxMessages
      tags:
        - Sandbox (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      parameters:
        - name: recipient
          in: query
          required: false
          schema:
            type: string
          description: Exact email address or E.164 number. Not a prefix or substring match.
          example: ada@example.test
        - name: channel
          in: query
          required: false
          schema:
            type: string
            enum: [email, sms]
          description: Restrict to one channel.
          example: email
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Page size. Above 200 is clamped to 200; a non-integer is rejected.
          example: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: How many of the newest messages to skip. Negative is treated as 0; a non-integer is rejected.
          example: 0
      responses:
        '200':
          description: One page of captures, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxMessageListResponse'
        '400':
          description: channel is neither email nor sms, or limit or offset is not an integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            The credential addresses live. Nothing is ever captured outside test, so an empty
            list would be a true answer to the wrong question — and "my message is missing" is
            a far worse thing to leave an operator concluding than "you are looking at the
            wrong environment".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      summary: Empty The Sandbox Inbox
      description: >-
        Deletes every capture belonging to the calling tenant's test environment and reports
        how many were removed. Run it at the start of a test run so an assertion on "the newest
        message" is not answered by the previous run's captures.
      operationId: purgeSandboxMessages
      tags:
        - Sandbox (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      responses:
        '200':
          description: Inbox emptied, with the number of captures removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxPurgeResponse'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The credential addresses live, where nothing is captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/tenant/sandbox/messages/{id}:
    get:
      summary: Read One Captured Message
      description: >-
        Returns a single capture including body — the message exactly as the provider would
        have received it. This is the endpoint to use when the rendered document itself is
        under test; the extracted code and link are on the listing too.
      operationId: getSandboxMessage
      tags:
        - Sandbox (Tenant)
      security:
        - SecretKey: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Captured message ID.
          example: sbxmsg_2f9c1a7b4e0d
      responses:
        '200':
          description: The capture, including its rendered body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxMessageResponse'
        '400':
          description: Message ID missing from the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The credential addresses live, where nothing is captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: >-
            No such capture, or it belongs to another tenant. The two are deliberately
            indistinguishable, since telling the caller that the ID exists somewhere is itself
            the disclosure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/tenant/delivery/verify:
    post:
      summary: Send One Real Message Through The Configured Provider
      description: >-
        Sends a single real message through the configured email or SMS driver, deliberately
        bypassing the sandbox. That bypass is the entire purpose: a captured message never
        reaches a provider, so no amount of sandbox traffic establishes that the credentials in
        configuration work. Sending is the only test of a send.

        The recipient is the signed-in operator's own stored address and there is no field to
        supply one, so this endpoint cannot be aimed at a third party by construction rather
        than by validation. That is also why a secret key is refused: it identifies an
        application rather than a person, and there is no address behind it that anybody has
        proven control of.

        driver names the backend that answered, so an operator can see which one handled the
        message instead of inferring it from configuration they may not be looking at.
      operationId: verifyDelivery
      tags:
        - Sandbox (Tenant)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyDeliveryRequest'
      responses:
        '200':
          description: The provider accepted the message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyDeliveryResponse'
        '400':
          description: Unparseable body, or channel is neither email nor sms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            A secret key was used rather than a console session (code forbidden); the
            operator's own email address is unverified (code email_verification_required); or
            channel sms was asked for with no verified phone number on the operator's account
            (code forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The signed-in operator's account could not be read in this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: >-
            More than three verifications for this tenant and channel in one rate-limit
            window. Retry-After carries the remaining seconds. The cap is low because the
            endpoint sends to the operator's own address through their own provider account,
            so the second message tells them exactly what the first one did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: >-
            The provider rejected the message. Its own error text is included verbatim, since
            that string is the answer the caller came for.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: No provider is configured for that channel, or the rate-limit service is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

