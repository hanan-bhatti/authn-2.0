  /v1/admin/webhooks/endpoints:
    post:
      summary: Create Webhook Endpoint
      description: >-
        Registers a new webhook endpoint for one environment. `environment` is required
        and has no default, because an endpoint that guessed would either miss the events
        its owner expected or deliver sandbox activity to a production subscriber. The
        generated signing secret is returned ONLY ONCE in this response.
      operationId: createWebhookEndpoint
      tags:
        - Webhooks (Admin)
      security:
        - SecretKey: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpointRequest'
      responses:
        '201':
          description: Webhook endpoint registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointResponse'
        '400':
          description: Invalid request JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Code `live_key_required`. A registration may name the `live` environment — or
            `all` — whichever key made it, so a test key able to register endpoints could
            still point live traffic at a destination of its choosing. Registering an entry
            therefore requires a live secret key. The three read routes accept either.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: >-
            Code `validation_failed`. Invalid HTTPS URL, missing or unrecognised
            `environment`, empty/invalid events, or unsupported event type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      summary: List Webhook Endpoints
      description: Returns every webhook endpoint registered by the tenant. Secrets are excluded.
      operationId: listWebhookEndpoints
      tags:
        - Webhooks (Admin)
      security:
        - SecretKey: []
        - BearerAuth: []
      responses:
