            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    SecretKey:
      type: apiKey
      in: header
      name: X-Authn-Secret-Key
      description: Backend server / SDK secret key (sk_test_... or sk_live_...)
    PublishableKey:
      type: apiKey
      in: header
      name: X-Authn-Publishable-Key
      description: Client-side publishable key (pk_test_... or pk_live_...)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: End-user JWT access token or Tenant Admin console JWT token

  schemas:
    # --------------------------------------------------------------------------
    # API Keys Schemas
    # --------------------------------------------------------------------------
    CreateKeyRequest:
      type: object
      required:
        - name
        - type
      properties:
        application_id:
          type: string
          example: app_00000000000000000000000000000001
          description: Owning application ID. Required for console JWT callers, optional for sk_ callers.
        name:
          type: string
          example: Production Stripe Webhook Key
          description: Operator-facing label for the key
        type:
          type: string
          enum: [publishable, secret]
          example: publishable
          description: Scope of the key
        environment:
          type: string
          enum: [test, live]
          example: test
          description: Mode environment matching the caller
        expires_in_days:
          type: integer
          example: 30
          description: Optional validity duration in days

    KeyDTO:
      type: object
      required:
        - id
        - application_id
        - name
        - type
        - key_prefix
        - environment
        - created_at
      properties:
        id:
          type: string
          example: key_1a2b3c
        application_id:
          type: string
          example: app_00000000000000000000000000000001
        name:
          type: string
          example: Production Key
        type:
          type: string
          example: publishable
        key_prefix:
          type: string
          example: pk_test_
        environment:
          type: string
          example: test
        created_at:
          type: string
          format: date-time
          example: '2026-08-01T12:00:00Z'
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-31T12:00:00Z'
        revoked_at:
          type: string
          format: date-time
          nullable: true
          example: null

    CreateKeyResponse:
      type: object
      required:
        - key
        - raw_key
      properties:
        key:
          $ref: '#/components/schemas/KeyDTO'
        raw_key:
          type: string
          example: pk_test_12345678901234567890123456789012
          description: Usable API key string; returned only once on creation

    RevokeKeyResponse:
      type: object
      required:
        - status
        - id
      properties:
        status:
          type: string
          example: revoked
        id:
          type: string
          example: key_1a2b3c

    # --------------------------------------------------------------------------
    # Impersonation & Policy Schemas
    # --------------------------------------------------------------------------
    ImpersonateRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          example: Investigating billing issue reported in support ticket
          description: Justification string (10 to 500 characters)
        duration_minutes:
          type: integer
          example: 15
          description: Requested session length in minutes (clamped to tenant policy max)
        ticket_id:
          type: string
          example: TICKET-10492
          description: Optional support ticket reference (3 to 100 characters)
        verification_method:
          type: string
          enum: [password, totp, webauthn, passkey]
          example: password
          description: Step-up authentication method presented by the admin
        mfa_code:
          type: string
          example: '123456'
          description: TOTP 2FA verification code
        admin_password:
          type: string
          example: AdminSecretPassword123!
          description: Admin's own password for step-up verification
        credential_id:
          type: string
          example: cred_webauthn_99
          description: WebAuthn passkey credential identifier

    UserInfo:
      type: object
      required:
        - id
        - email
        - status
        - email_verified
      properties:
        id:
          type: string
          example: usr_1a2b3c
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          nullable: true
          example: Jane Doe
        status:
          type: string
          example: active
        email_verified:
          type: boolean
          example: true

    ImpersonationResult:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - impersonated_user
        - impersonator_id
        - session_id
      properties:
        access_token:
          type: string
          description: Impersonated JWT access token
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
          description: Token lifetime in seconds
        impersonated_user:
          $ref: '#/components/schemas/UserInfo'
        impersonator_id:
          type: string
          example: usr_admin_99
        session_id:
          type: string
          example: ses_imp_1750000000000000000

    ImpersonationPolicy:
      type: object
      required:
        - enabled
        - max_duration_minutes
        - require_step_up_auth
        - require_ticket_id
        - require_user_opt_in
        - email_notification_policy
        - read_only_default
        - restrict_admin_impersonation
        - allowed_roles
      properties:
        enabled:
          type: boolean
          example: true
        max_duration_minutes:
          type: integer
          minimum: 1
          maximum: 60
          example: 15
        require_step_up_auth:
          type: boolean
          example: true
        require_ticket_id:
          type: boolean
          example: false
        require_user_opt_in:
          type: boolean
          example: false
        email_notification_policy:
          type: string
          enum: [IMMEDIATE, POST_SESSION, DISABLED]
          example: IMMEDIATE
        read_only_default:
          type: boolean
          example: false
        restrict_admin_impersonation:
          type: boolean
          example: true
        allowed_roles:
          type: array
          items:
            type: string
          example: [tenant_admin, support_admin]

    ExitImpersonationResponse:
      type: object
      required:
        - message
        - impersonated_id
        - impersonator_id
      properties:
        message:
          type: string
          example: impersonation session exited successfully
        impersonated_id:
          type: string
          example: usr_target_123
        impersonator_id:
          type: string
          example: usr_admin_99

    EnvironmentEnvelope:
      type: object
      required:
        - environment
      properties:
        environment:
          type: string
          enum: [test, live]
          description: >-
            The environment this response describes, echoed from the credential that
            authenticated the request. A sk_test_ key reads and writes test settings, a
            sk_live_ key live ones, and there is no way to reach one environment while
            holding the other's key. It is echoed because "I changed the policy and
            nothing happened" is otherwise indistinguishable from having configured the
            other environment by mistake.
          example: test

    SessionPolicy:
      type: object
      required:
        - cookie_same_site
        - access_token_ttl_minutes
        - refresh_token_ttl_days
      properties:
        cookie_same_site:
          type: string
          enum: [lax, none]
          description: >-
            SameSite attribute of the refresh cookie. Use lax when your applications sit
            under one parent domain; none is required when the browser must send the cookie
            to a genuinely different site, and pairs with Secure. Requesting none is stored
            as asked but honoured only when the cookie will also carry Secure; over plaintext
            HTTP the cookie is written Lax instead, because browsers drop a non-Secure
            SameSite=None cookie outright and a same-site session beats no session.
          example: lax
        access_token_ttl_minutes:
          type: integer
          enum: [0, 15, 30, 60]
          description: >-
            Access token lifetime in minutes, chosen from a fixed menu. Zero inherits the
            deployment default. The menu exists because the number trades off two things it
            does not state: how long a stolen token keeps working, and how often every client
            pays a refresh round-trip. Three points make that a choice between postures with
            documented consequences — 15 for a console moving money, 60 for an app whose users
            resent re-authenticating — where a free-form minute count invites 1440 and calls
            it convenience. An unlisted value is refused with 422 rather than approximated.
          example: 15
        refresh_token_ttl_days:
          type: integer
          minimum: 1
          maximum: 365
          description: >-
            How long a session may be refreshed before the person signs in again. Zero
            inherits the deployment default, and out-of-range values are clamped. It
            governs the stored session and the refresh cookie together, so shortening it
            is enforced against a holder of the raw token and not only against a browser
            that respects cookie expiry. In test the ceiling TEST_SESSION_TTL shortens it
            further.
          example: 30

    TenantSettings:
      type: object
      description: >-
        Every policy column of one environment's settings row, as stored. A column absent
        or empty means nothing has been configured and the engine's defaults apply, which
        is why no column is required here. Each social provider's client secret is replaced
        by a client_secret_set boolean.
      properties:
        branding_config:
          type: object
          additionalProperties: true
          description: Hosted-page branding for this environment.
        password_policy:
          type: object
          additionalProperties: true
          description: Password complexity requirements. Shaped like PasswordPolicy.
        security_policy:
          type: object
          additionalProperties: true
          description: Security enforcement settings. Shaped like SecurityPolicy.
        recovery_policy:
          type: object
          additionalProperties: true
          description: Account recovery rules. Shaped like RecoveryPolicy.
        social_providers:
          type: object
          additionalProperties: true
          description: >-
            Social provider configuration keyed by provider, with each client secret
            replaced by client_secret_set. Configuring a provider in test does not
            configure it in live; each environment holds its own OAuth client.
        role_policy:
          type: object
          additionalProperties: true
          description: Default role assignment for members created in this environment.
        session_policy:
          type: object
          additionalProperties: true
          description: Session and cookie settings. Shaped like SessionPolicy.

    TenantSettingsResponse:
      type: object
      required:
        - environment
        - settings
      properties:
        environment:
          type: string
          enum: [test, live]
          description: Environment the settings belong to, taken from the credential.
          example: test
        settings:
          $ref: '#/components/schemas/TenantSettings'

    TenantSettingsDiffResponse:
      type: object
      required:
        - environment
        - test
        - live
        - differs
      properties:
        environment:
          type: string
          enum: [test, live]
          description: >-
            Environment of the credential that made the request. Both environments are
            returned whichever key was used, since comparing them is the point.
          example: test
        test:
          $ref: '#/components/schemas/TenantSettings'
        live:
          $ref: '#/components/schemas/TenantSettings'
        differs:
          type: array
          items:
            type: string
          description: >-
            Names of the policy columns whose stored values differ between the two
            environments, in a stable order. This is exactly what publishing test would
            change in live. An empty array means the two environments already match.
          example: [password_policy, session_policy]

    PublishSettingsRequest:
      type: object
      description: >-
        Names the environments a publish moves settings between. The body may be omitted
        entirely, which means test to live.
      properties:
        from:
          type: string
          enum: [test, live]
          default: test
          description: Environment whose settings are copied. Read across the boundary, since a publish that could not read test could not publish anything.
          example: test
        to:
          type: string
          enum: [test, live]
          default: live
          description: >-
            Environment overwritten. Must match the environment of the key making the
            request, so publishing into live requires a sk_live_ key. That is the guard
            that stops a test key overwriting a live configuration. Must also differ from
            from, because copying an environment onto itself would stamp a promotion in the
            audit trail that never happened.
          example: live

    PublishSettingsResponse:
      type: object
      required:
        - message
        - from
        - to
        - changed
        - settings
      properties:
        message:
          type: string
          example: settings published
        from:
          type: string
          enum: [test, live]
          example: test
        to:
          type: string
          enum: [test, live]
          example: live
        changed:
          type: array
          items:
            type: string
          description: >-
            Names of the columns the publish altered, measured against the destination as
            it stood before the write. An empty array means the destination already matched
            the source, so the publish recorded itself and changed nothing else. Only names
            are reported and never values, because the values include provider secrets.
          example: [password_policy, session_policy]
        settings:
          allOf:
            - $ref: '#/components/schemas/TenantSettings'
          description: What the destination now holds, which is a verbatim copy of the source.

    # --------------------------------------------------------------------------
    # Sandbox Inbox & Delivery Verification Schemas
    # --------------------------------------------------------------------------
    SandboxMessage:
      type: object
      required:
        - id
        - channel
        - environment
        - recipient
        - created_at
      properties:
        id:
          type: string
          example: sbxmsg_2f9c1a7b4e0d
        channel:
          type: string
          enum: [email, sms]
          example: email
        environment:
          type: string
          enum: [test, live]
          description: >-
            Always test in practice. The column exists so this table is narrowed by the same
            interceptor predicate as every other environment-scoped one, which is what stops a
            live key reading sandbox traffic.
          example: test
        recipient:
          type: string
          description: The address the message was aimed at — an email address, or E.164 for SMS.
          example: ada@example.test
        subject:
          type: string
          description: Absent for SMS, which has none.
          example: Verify your email address
        template:
          type: string
          enum:
            - email_verification
            - magic_link
            - two_factor_code
            - impersonation_notice
            - email_change
            - recovery_email_verification
          description: >-
            Which template produced the message, classified from the subject using the sender's
            own subject constants. An unrecognised subject stores an empty value rather than a
            guess: this field exists so a test can assert which message was triggered, and a
            wrong answer would defeat that more thoroughly than an absent one.
          example: email_verification
        code:
          type: string
          description: >-
            The one-time code, lifted out at capture time so completing a flow does not mean
            parsing rendered HTML. Read from the plain-text alternative in preference to the
            HTML one, since both carry the same code and only one is wrapped in a stylesheet.
            Absent when the message carries none.
          example: "482915"
        metadata:
          type: object
          additionalProperties: true
          description: >-
            link is the action URL carrying the authenticating token; text_body is the
            plain-text alternative of an email.
          example:
            link: https://api.authn.com/v1/client/auth/verify-email?token=32b3c1b7a1695dbb
            text_body: Welcome to Acme! Please verify your email address...
        body:
          type: string
          description: >-
            The message exactly as the provider would have received it. Returned only on a
            single-message read, never in a listing.
          example: <!DOCTYPE html><html>...</html>
        created_at:
          type: string
          format: date-time
          example: '2026-08-19T11:04:22Z'

    SandboxMessageListResponse:
      type: object
      required:
        - environment
        - messages
        - total
      properties:
        environment:
          type: string
          enum: [test]
          description: Environment the inbox belongs to, taken from the credential.
          example: test
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SandboxMessage'
          description: One page of captures, newest first, so messages[0] is what the flow just triggered produced. body is omitted here.
        total:
          type: integer
          description: >-
            Every message matching the filter, counted before paging. A test polling for a
            message cannot learn this from the page length, which is why it is reported
            separately.
          example: 2

    SandboxMessageResponse:
      type: object
      required:
        - environment
        - message
      properties:
        environment:
          type: string
          enum: [test]
          example: test
        message:
          allOf:
            - $ref: '#/components/schemas/SandboxMessage'
          description: The capture including its rendered body.

    SandboxPurgeResponse:
      type: object
      required:
        - message
        - environment
        - removed
      properties:
        message:
          type: string
          example: sandbox inbox emptied
        environment:
          type: string
          enum: [test]
          example: test
        removed:
          type: integer
          description: Captures deleted. Only the calling tenant's test messages are touched.
          example: 12

    VerifyDeliveryRequest:
      type: object
      required:
        - channel
      description: >-
        Notably absent is a recipient. The address is the signed-in operator's own, which makes
        it impossible to aim this endpoint at somebody else rather than merely against the
        rules — and a check of whether a provider accepts mail does not need a choice of target
        to answer.
      properties:
        channel:
          type: string
          enum: [email, sms]
          description: Which configured driver to exercise.
          example: email

    VerifyDeliveryResponse:
      type: object
      required:
        - message
        - channel
        - recipient
        - driver
      properties:
        message:
          type: string
          example: delivery test accepted by the provider
        channel:
          type: string
          enum: [email, sms]
          example: email
        recipient:
          type: string
          description: The operator's own verified email address or phone number, read from their account.
          example: operator@acme.com
        driver:
          type: string
          description: The configured backend that accepted the message.
          example: aws_ses

    PasswordPolicy:
      type: object
      required:
        - enforcement_mode
        - require_uppercase
        - require_lowercase
        - require_numeric
        - require_special
        - force_upgrade_on_signin
        - min_length
        - max_length
      properties:
        enforcement_mode:
          type: string
          enum: [require, notify]
          example: require
        require_uppercase:
          type: boolean
          example: false
        require_lowercase:
          type: boolean
          example: false
        require_numeric:
          type: boolean
          example: true
        require_special:
          type: boolean
          example: false
        force_upgrade_on_signin:
          type: boolean
          example: false
        min_length:
          type: integer
          minimum: 8
          example: 8
        max_length:
          type: integer
          maximum: 4096
          example: 4096

    SecurityPolicy:
      type: object
      required:
        - require_email_verification
        - email_verification_mode
        - token_reuse_policy
      properties:
        require_email_verification:
          type: boolean
          example: false
        email_verification_mode:
          type: string
          enum: [hard, soft]
          example: soft
        token_reuse_policy:
          type: string
          enum: [global_revoke, session_revoke]
          example: global_revoke

    RecoveryPolicy:
      type: object
      required:
        - guardians_enabled
        - phone_otp_enabled
        - email_otp_enabled
        - old_password_enabled
        - security_questions_enabled
        - freeze_window_hours
        - claim_token_ttl_minutes
        - lockout_schedule
        - lockout_reset_days
        - trusted_device_window_days
        - min_guardians
        - max_guardians
        - ipv4_subnet_bits
        - ipv6_subnet_bits
        - max_proof_attempts_per_window
      properties:
        guardians_enabled:
          type: boolean
          example: true
        phone_otp_enabled:
          type: boolean
          example: true
        email_otp_enabled:
          type: boolean
          example: true
        old_password_enabled:
          type: boolean
          example: true
        security_questions_enabled:
          type: boolean
          example: true
        freeze_window_hours:
          type: integer
          minimum: 24
          maximum: 168
          example: 48
        claim_token_ttl_minutes:
          type: integer
          minimum: 5
          maximum: 60
          example: 15
        lockout_schedule:
          type: array
          items:
            type: string
          example: [24h, 3d, 7d, 14d, 4w, 8w, 12w, permanent]
        lockout_reset_days:
          type: integer
          minimum: 7
          maximum: 90
          example: 30
        trusted_device_window_days:
          type: integer
          minimum: 30
          maximum: 365
          example: 90
        min_guardians:
          type: integer
          minimum: 1
          example: 1
        max_guardians:
          type: integer
          maximum: 5
          example: 5
        ipv4_subnet_bits:
          type: integer
          minimum: 16
          maximum: 30
          example: 24
        ipv6_subnet_bits:
          type: integer
          minimum: 32
          maximum: 64
          example: 48
        max_proof_attempts_per_window:
          type: integer
          minimum: 1
          maximum: 10
          example: 3

    # --------------------------------------------------------------------------
    # RBAC Schemas
    # --------------------------------------------------------------------------
    CreateRoleRequest:
      type: object
      required:
        - name
      properties:
        tenant_id:
          type: string
          example: tnt_1a2b3c
          description: Optional target tenant ID
        name:
          type: string
          example: Support Agent
        slug:
          type: string
          example: support_agent
        description:
          type: string
          example: Customer support team role with limited administrative scope
        permissions:
          type: array
          items:
            type: string
          example: [users:read, users:impersonate]

    Role:
      type: object
      required:
        - id
        - tenant_id
        - name
        - slug
        - is_system_role
        - created_at
        - updated_at
      properties:
        id:
          type: string
          example: rol_1a2b3c
        tenant_id:
          type: string
          example: tnt_1a2b3c
        name:
          type: string
          example: Support Agent
        slug:
          type: string
          example: support_agent
        description:
          type: string
          example: Support team role
        is_system_role:
          type: boolean
          example: false
        created_by_user_id:
          type: string
          nullable: true
          example: usr_admin_1
        updated_by_user_id:
          type: string
          nullable: true
          example: usr_admin_1
        created_at:
          type: string
          format: date-time
          example: '2026-08-01T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-08-01T12:00:00Z'

    RoleListResponse:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    UpdateRolePermissionsRequest:
      type: object
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
          example: [users:read, users:impersonate, audit:read]

    UpdateRolePermissionsResponse:
      type: object
      required:
        - message
        - role_id
      properties:
        message:
          type: string
          example: permissions updated successfully
        role_id:
          type: string
          example: rol_1a2b3c

    AssignUserRoleRequest:
      type: object
      properties:
        role_slug:
          type: string
          example: support_agent
          description: Role slug identifier to assign
        role:
          type: string
          example: support_agent
          description: Fallback role slug parameter

    AssignUserRoleResponse:
      type: object
      required:
        - message
        - user_id
        - role
      properties:
        message:
          type: string
          example: role assigned to user successfully
        user_id:
          type: string
          example: usr_1a2b3c
        role:
          type: string
          example: support_agent

    RevokeUserRoleResponse:
      type: object
      required:
        - message
        - user_id
        - role
      properties:
        message:
          type: string
          example: role revoked from user successfully
        user_id:
          type: string
          example: usr_1a2b3c
        role:
          type: string
          example: support_agent

    UserPermissionsResponse:
      type: object
      required:
        - user_id
        - roles
        - permissions
      properties:
        user_id:
          type: string
          example: usr_1a2b3c
        roles:
          type: array
          items:
            type: string
          example: [support_admin]
        permissions:
          type: array
          items:
            type: string
          example: [users:read, users:impersonate]

    # --------------------------------------------------------------------------
    # Webhook Schemas
    # --------------------------------------------------------------------------
    CreateEndpointRequest:
      type: object
      required:
        - url
        - description
        - environment
        - events
      properties:
        url:
          type: string
          format: uri
          example: https://api.example.com/webhooks/authn
        description:
          type: string
          example: Primary Webhook Receiver
        environment:
          type: string
          enum: [test, live, all]
          description: >-
            Which environment's events this endpoint receives. `all` receives both and
            relies on the `environment` field in the signed payload to tell them apart.
            Required — there is no default.
          example: live
        events:
          type: array
          items:
            type: string
          example: [user.created, user.updated, session.revoked]

    UpdateEndpointRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: https://api.example.com/webhooks/authn-v2
        description:
          type: string
          example: Updated Primary Webhook Receiver
        environment:
          type: string
          enum: [test, live, all]
          description: Omit to leave the endpoint's environment unchanged.
          example: all
        events:
          type: array
          items:
            type: string
          example: [user.created, user.deleted]
        is_active:
          type: boolean
          example: true

    EndpointResponse:
      type: object
      required:
        - id
        - url
        - environment
        - description
        - subscribed_events
        - is_active
        - failure_count
        - created_at
      properties:
        id:
          type: string
          example: whep_1a2b3c
        url:
          type: string
          format: uri
          example: https://api.example.com/webhooks/authn
        environment:
          type: string
          enum: [test, live, all]
          example: live
        description:
          type: string
          example: Primary Webhook Receiver
        secret:
          type: string
          example: whsec_12345678901234567890123456789012
          description: Signing secret string (returned only on creation or rotation)
        subscribed_events:
          type: array
          items:
            type: string
          example: [user.created, user.updated]
        is_active:
          type: boolean
          example: true
        failure_count:
          type: integer
          example: 0
        last_triggered_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-01T14:30:00Z'
        created_at:
          type: string
          format: date-time
          example: '2026-08-01T12:00:00Z'

    WebhookEndpointListResponse:
      type: object
      required:
        - endpoints
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/EndpointResponse'

    DeleteEndpointResponse:
      type: object
      required:
        - message
        - endpoint_id
      properties:
        message:
          type: string
          example: webhook endpoint deleted successfully
        endpoint_id:
          type: string
          example: whep_1a2b3c

    DeliveryResponse:
      type: object
      required:
        - id
        - endpoint_id
        - event_type
        - payload
        - status_code
        - response_body
        - error_message
        - status
        - created_at
      properties:
        id:
          type: string
          example: whdel_1a2b3c
        endpoint_id:
          type: string
          example: whep_1a2b3c
        event_type:
          type: string
          example: user.created
        payload:
          type: object
          additionalProperties: true
          example:
            event: user.created
            user_id: usr_1a2b3c
        status_code:
          type: integer
          example: 200
        response_body:
          type: string
          example: '{"status":"ok"}'
        error_message:
          type: string
          example: ''
        status:
          type: string
          example: success
        created_at:
          type: string
          format: date-time
          example: '2026-08-01T14:30:00Z'

    SendTestPingResponse:
      type: object
      required:
        - message
        - delivery
      properties:
        message:
          type: string
          example: test ping webhook event delivered
        delivery:
          $ref: '#/components/schemas/DeliveryResponse'

    DeliveryListResponse:
      type: object
      required:
        - deliveries
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryResponse'

    RedeliverResponse:
      type: object
      required:
        - message
        - delivery
      properties:
        message:
          type: string
          example: webhook re-delivery executed
        delivery:
          $ref: '#/components/schemas/DeliveryResponse'

    # --------------------------------------------------------------------------
    # Common Error Envelope
    # --------------------------------------------------------------------------
    ErrorEnvelope:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message
          example: unauthorized access
        code:
          type: string
          description: Machine-readable error code
          example: unauthorized
