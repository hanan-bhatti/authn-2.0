openapi: 3.0.3
info:
  title: Enterprise SAML SSO Fragment (Chunk SAML)
  description: Verified OpenAPI 3.0 specification fragment for Enterprise SAML 2.0 endpoints in apps/auth-engine.
  version: 1.0.0

paths:
  /v1/saml/acs:
    post:
      summary: Process SAML Assertion Consumer Service (ACS)
      operationId: processACS
      tags:
        - Enterprise SAML
      description: |
        Assertion Consumer Service endpoint for SAML 2.0 Identity Providers.
        Processes SAMLResponse assertions submitted via HTTP POST binding (JSON or URL-encoded form data).
        This is an unauthenticated protocol endpoint; security is guaranteed by XML signature verification and assertion validation. The tenant is derived from the assertion Issuer rather than supplied by the caller.

        A validated assertion is carried on a real session in the same store the password and social paths write to, so an SSO sign-in is listed in the user's device list and revoked like any other. The refresh token is delivered only as an HttpOnly cookie, under the tenant's configured SameSite and lifetime policy.

        The response shape depends on RelayState. With a registered destination the browser is redirected there with the access token in the URL fragment; without one, or with a destination the tenant has not registered, the token is returned in the 200 body instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ACSRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ACSRequest'
      responses:
        '302':
          description: |
            Assertion validated and RelayState named a registered destination.

            The access token is in the URL fragment, which is never transmitted to any server; it must not be moved to the query string, where it would land in browser history, access logs, proxy logs and the Referer of any cross-origin subresource. The refresh token is in the Set-Cookie header and never in the Location.
          headers:
            Location:
              description: The registered destination, with the access token appended in the fragment.
              schema:
                type: string
                example: https://app.acme.com/sso/landing#access_token=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c3JfMWEyYjNjNGQifQ.8STDe5Dno&token_type=Bearer
            Set-Cookie:
              description: HttpOnly refresh cookie for the new session.
              schema:
                type: string
                example: authn_refresh_token=a8cd8149c3ff1fe8bfacf85517c6094f; path=/; HttpOnly; secure; SameSite=Lax
        '200':
          description: |
            Assertion validated, and no usable resume destination was supplied.

            This is the normal outcome for an identity-provider-initiated sign-in, which carries no RelayState. It is also the fallback when RelayState named a destination the tenant has not registered: the assertion has already been consumed by that point and is single-use, so refusing would cost the user a sign-in they cannot retry. The refusal is logged server-side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACSResponse'
          headers:
            Set-Cookie:
              description: HttpOnly refresh cookie for the new session.
              schema:
                type: string
                example: authn_refresh_token=a8cd8149c3ff1fe8bfacf85517c6094f; path=/; HttpOnly; secure; SameSite=Lax
        '400':
          description: Missing or malformed SAMLResponse payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: missing SAMLResponse payload
                code: missing_parameter
        '403':
          description: |
            SAML assertion validation failed.

            Covers a bad signature, an unknown issuer, an expired or already-used assertion, a wrong audience, a domain the connection is not authorized for, and a missing subject email. The reason is deliberately not itemized: this endpoint accepts unauthenticated input, and distinguishing the cases would let anyone map a tenant's SSO configuration by posting crafted assertions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: SAML assertion could not be validated for this service provider
                code: forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: an internal error occurred while processing this request
                code: internal_error

  /v1/saml/metadata/{orgId}:
    get:
      summary: Get Service Provider SAML Metadata XML
      operationId: getSPMetadata
      tags:
        - Enterprise SAML
      description: |
        Returns the SAML 2.0 Service Provider (SP) metadata XML document for an organization.
        This is an unauthenticated public endpoint fetched by Identity Provider administrators to configure SSO integrations.
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID to retrieve metadata for
          schema:
            type: string
      responses:
        '200':
          description: SAML 2.0 SP Metadata XML document
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=3600
          content:
            application/xml:
              schema:
                type: string
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <EntityDescriptor entityID="https://authn.com/saml/sp/org_aac11dae-f5c" xmlns="urn:oasis:names:tc:SAML:2.0:metadata">
                  <SPSSODescriptor AuthnRequestsSigned="false" WantAssertionsSigned="true" protocolSupportEnumeration="urn:oasis:names:tc:SAML:2.0:protocol">
                    <NameIDFormat>urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress</NameIDFormat>
                    <AssertionConsumerService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST" Location="http://localhost:8080/v1/saml/acs" index="1"/>
                  </SPSSODescriptor>
                </EntityDescriptor>
        '404':
          description: SAML connection configuration not found for organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: SAML connection configuration not found for organization
                code: not_found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/client/auth/domain-lookup:
    post:
      summary: Lookup Domain SSO Configuration
      operationId: lookupDomainSSO
      tags:
        - Enterprise SAML
        - Client Authentication
      description: |
        Inspects an email address or domain prior to sign-in to determine if Enterprise SAML SSO is configured or mandatory.
      security:
        - PublishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainLookupRequest'
      responses:
        '200':
          description: Domain lookup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainLookupResponse'
        '400':
          description: Missing email or valid domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: email or valid domain is required
                code: validation_failed
        '401':
          description: Unauthorized - Tenant resolution failed or missing Publishable Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: tenant could not be resolved for this request
                code: unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/client/organizations/{orgId}/saml:
    post:
      summary: Create SAML Connection (Client API)
      operationId: createClientSAMLConnection
      tags:
        - Enterprise SAML
        - Client Organizations
      description: |
        Configures Enterprise SAML 2.0 SSO for the specified organization via Client API.
      security:
        - PublishableKey: []
          BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSAMLRequest'
      responses:
        '201':
          description: SAML connection created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAMLConnectionResponse'
        '400':
          description: Invalid configuration parameter or domain already mapped to another SAML connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Code `live_key_required`. A test credential may not file a connection in
            `live`. Because `environment` defaults to `live`, omitting it is the same
            request as naming it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: a live SAML connection can only be created, changed or deleted with a live key
                code: live_key_required
        '409':
          description: SAML connection already exists for this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: SAML connection already exists for this organization
                code: already_exists
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      summary: Get SAML Connection (Client API)
      operationId: getClientSAMLConnection
      tags:
        - Enterprise SAML
        - Client Organizations
      description: |
        Retrieves the active SAML 2.0 connection settings for the specified organization via Client API.
      security:
        - PublishableKey: []
          BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
      responses:
        '200':
          description: SAML connection configuration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAMLConnectionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: SAML connection configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: SAML connection configuration not found
                code: not_found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    patch:
      summary: Update SAML Connection (Client API)
      operationId: updateClientSAMLConnection
      tags:
        - Enterprise SAML
        - Client Organizations
      description: |
        Updates existing SAML 2.0 connection settings for the specified organization via Client API.
      security:
        - PublishableKey: []
          BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSAMLRequest'
      responses:
        '200':
          description: SAML connection updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAMLConnectionResponse'
        '400':
          description: Invalid configuration parameter or domain conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Code `live_key_required`. A test credential may not edit a connection that
            sits in `live`, nor promote a test one into it. Editing a connection that
            stays in `test` is permitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: a live SAML connection can only be created, changed or deleted with a live key
                code: live_key_required
        '404':
          description: SAML connection configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: SAML connection configuration not found
                code: not_found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      summary: Delete SAML Connection (Client API)
      operationId: deleteClientSAMLConnection
      tags:
        - Enterprise SAML
        - Client Organizations
      description: |
        Deletes the SAML 2.0 connection configuration for the specified organization via Client API.
      security:
        - PublishableKey: []
          BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
      responses:
        '200':
          description: SAML connection deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSAMLConnectionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Code `live_key_required`. A test credential may not delete a connection
            that sits in `live`. Deleting one locks every employee out of the
            organization, so it is the same live act as configuring it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: a live SAML connection can only be created, changed or deleted with a live key
                code: live_key_required
        '404':
          description: SAML connection configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: SAML connection configuration not found
                code: not_found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/tenant/organizations/{orgId}/saml:
    post:
      summary: Create SAML Connection (Tenant Admin API)
      operationId: createTenantSAMLConnection
      tags:
        - Enterprise SAML
        - Tenant Admin SAML
      description: |
        Tenant admin endpoint to configure Enterprise SAML 2.0 SSO for an organization.
      security:
        - SecretKey: []
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSAMLRequest'
      responses:
        '201':
          description: SAML connection created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAMLConnectionResponse'
        '400':
          description: Invalid configuration parameter or domain conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Either the credential lacks tenant admin privileges, or code
            `live_key_required`: a test credential may not file a connection in
            `live`. Because `environment` defaults to `live`, omitting it is the same
            request as naming it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: SAML connection already exists for this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: SAML connection already exists for this organization
                code: already_exists
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      summary: Get SAML Connection (Tenant Admin API)
      operationId: getTenantSAMLConnection
      tags:
        - Enterprise SAML
        - Tenant Admin SAML
      description: |
        Tenant admin endpoint to retrieve SAML 2.0 connection settings for an organization.
      security:
        - SecretKey: []
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
      responses:
        '200':
          description: SAML connection configuration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAMLConnectionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden - Requires tenant admin privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: SAML connection configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: SAML connection configuration not found
                code: not_found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    patch:
      summary: Update SAML Connection (Tenant Admin API)
      operationId: updateTenantSAMLConnection
      tags:
        - Enterprise SAML
        - Tenant Admin SAML
      description: |
        Tenant admin endpoint to update SAML 2.0 connection settings for an organization.
      security:
        - SecretKey: []
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSAMLRequest'
      responses:
        '200':
          description: SAML connection updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAMLConnectionResponse'
        '400':
          description: Invalid configuration parameter or domain conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Either the credential lacks tenant admin privileges, or code
            `live_key_required`: a test credential may not edit a connection that sits
            in `live`, nor promote a test one into it. Editing a connection that stays
            in `test` is permitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: SAML connection configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: SAML connection configuration not found
                code: not_found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      summary: Delete SAML Connection (Tenant Admin API)
      operationId: deleteTenantSAMLConnection
      tags:
        - Enterprise SAML
        - Tenant Admin SAML
      description: |
        Tenant admin endpoint to delete SAML 2.0 connection settings for an organization.
      security:
        - SecretKey: []
        - BearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          description: Organization ID
          schema:
            type: string
      responses:
        '200':
          description: SAML connection deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSAMLConnectionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Either the credential lacks tenant admin privileges, or code
            `live_key_required`: a test credential may not delete a connection that
            sits in `live`. Deleting one locks every employee out of the organization,
            so it is the same live act as configuring it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: SAML connection configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: SAML connection configuration not found
                code: not_found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    PublishableKey:
      type: apiKey
      in: header
      name: X-Authn-Publishable-Key
      description: Client publishable API key (`pk_live_...` or `pk_test_...`)
    SecretKey:
      type: apiKey
      in: header
      name: X-Authn-Secret-Key
      description: Secret API key (`sk_live_...` or `sk_test_...`)
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session JWT or Tenant Admin Bearer token

  schemas:
    ErrorEnvelope:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Machine-readable error code.

    ACSRequest:
      type: object
      required:
        - SAMLResponse
      properties:
        SAMLResponse:
          type: string
          description: Base64-encoded SAML 2.0 Response XML document.
        RelayState:
          type: string
          description: |
            Destination the browser resumes at once the assertion validates.

            Treated as untrusted input: it is echoed back by the identity provider from whatever started the flow, and anyone can start one. It is accepted only when it is an absolute http(s) URL matching a destination the tenant registered in exact_redirect_uris on one of its applications, either exactly or by scheme and host. An unregistered, relative or non-http(s) value is refused and logged, and the response degrades to 200 with the token in the body rather than failing the sign-in.
          example: https://app.acme.com/sso/landing

    ACSResponse:
      type: object
      required:
        - message
        - access_token
        - token_type
        - user
        - organization
      properties:
        message:
          type: string
          example: SAML SSO authentication successful
        access_token:
          type: string
          description: |
            Signed JWT for the new session, carrying the sid claim of the session row it belongs to.

            Returned in the body only when no usable RelayState was supplied. When one was, the response is a 302 and this token travels in the URL fragment instead.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfMWEyYjNjNGQifQ.8STDe5DnoQDODuHKhVXN8R8nJcxxZqfMEEfUaMwg8tE
        token_type:
          type: string
          enum:
            - Bearer
          example: Bearer
        user:
          type: object
          required:
            - id
            - email
            - email_verified
          properties:
            id:
              type: string
              example: usr_1a2b3c4d
            email:
              type: string
              format: email
              example: user@acme.com
            email_verified:
              type: boolean
              example: true
        organization:
          type: object
          required:
            - id
            - name
            - slug
          properties:
            id:
              type: string
              example: org_aac11dae-f5c
            name:
              type: string
              example: Acme Enterprise Corp
            slug:
              type: string
              example: acme-corp

    DomainLookupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email address to derive target domain from (used when domain parameter is omitted).
          example: user@acme.com
        domain:
          type: string
          description: Explicit domain name to inspect directly.
          example: acme.com

    DomainLookupResponse:
      type: object
      required:
        - has_sso
        - enforce_sso
      properties:
        has_sso:
          type: boolean
          description: Indicates whether a SAML SSO connection claims this domain.
          example: true
        enforce_sso:
          type: boolean
          description: Indicates whether SAML SSO is strictly enforced for this domain.
          example: true
        org_id:
          type: string
          description: Mapped organization ID (present when has_sso is true).
          example: org_aac11dae-f5c
        org_name:
          type: string
          description: Mapped organization display name (present when has_sso is true).
          example: Acme Enterprise Corp
        idp_sso_url:
          type: string
          format: uri
          description: Identity Provider SSO authentication URL (present when has_sso is true).
          example: https://idp.acme.com/sso

    CreateSAMLRequest:
      type: object
      required:
        - idp_entity_id
        - idp_sso_url
        - idp_certificate
        - allowed_domains
      properties:
        idp_entity_id:
          type: string
          minLength: 3
          maxLength: 500
          description: Identity Provider Entity ID / Issuer URI.
          example: https://idp.acme.com/saml
        idp_sso_url:
          type: string
          format: uri
          maxLength: 2048
          description: Identity Provider Single Sign-On HTTP-POST / Redirect URL.
          example: https://idp.acme.com/sso
        idp_certificate:
          type: string
          maxLength: 10000
          description: PEM-formatted X.509 public signing certificate of the Identity Provider.
          example: "-----BEGIN CERTIFICATE-----\nMIIE...\n-----END CERTIFICATE-----"
        allowed_domains:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
          description: Email domains routed to this Identity Provider.
          example: ["acme.com", "acme.org"]
        attribute_mapping:
          type: object
          additionalProperties:
            type: string
          description: Optional JSON map linking SAML assertion attribute names to engine user fields.
          example:
            email: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
            name: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name
        enforce_sso:
          type: boolean
          default: false
          description: If true, direct password and social authentication are disabled for users in allowed_domains.
          example: true
        environment:
          type: string
          enum: [test, live]
          default: live
          description: >-
            Environment that users authenticated through this connection are provisioned into.
            Defaults to live, unlike every other environment field in the API, because a
            connection only exists once an administrator has supplied a real Identity
            Provider's certificate and SSO URL. Set it to test to trial a provider against
            sandbox accounts, then PATCH it to live once the assertions map to the right
            people.
          example: live

    UpdateSAMLRequest:
      type: object
      properties:
        idp_entity_id:
          type: string
          minLength: 3
          maxLength: 500
          description: Replaces the Identity Provider Entity ID when non-null.
          example: https://idp.acme.com/saml-v2
        idp_sso_url:
          type: string
          format: uri
          maxLength: 2048
          description: Replaces the Identity Provider SSO URL when non-null.
          example: https://idp.acme.com/sso-v2
        idp_certificate:
          type: string
          maxLength: 10000
          description: Replaces the PEM X.509 signing certificate when non-null.
          example: "-----BEGIN CERTIFICATE-----\nMIIF...\n-----END CERTIFICATE-----"
        allowed_domains:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
          description: Replaces the allowed email domain list when non-null.
          example: ["acme.com"]
        attribute_mapping:
          type: object
          additionalProperties:
            type: string
          description: Replaces the attribute mapping when non-null.
        enforce_sso:
          type: boolean
          description: Replaces the SSO enforcement flag when non-null.
          example: false
        environment:
          type: string
          enum: [test, live]
          description: >-
            Moves where future sign-ins through this provider are provisioned, when non-null.
            This is how a trialled connection is promoted to production. It governs sign-ins
            from this point on and does not migrate the accounts already created: an employee
            who signed in during the trial keeps their test account and is given a separate
            live one on their next sign-in.
          example: live

    SAMLConnectionResponse:
      type: object
      required:
        - id
        - organization_id
        - idp_entity_id
        - idp_sso_url
        - idp_certificate
        - allowed_domains
        - enforce_sso
        - environment
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique SAML connection identifier.
          example: saml_1307e93e-aa1
        organization_id:
          type: string
          description: Owning organization ID.
          example: org_aac11dae-f5c
        idp_entity_id:
          type: string
          description: Identity Provider Entity ID.
          example: https://idp.acme.com/saml
        idp_sso_url:
          type: string
          format: uri
          description: Identity Provider SSO URL.
          example: https://idp.acme.com/sso
        idp_certificate:
          type: string
          description: Public X.509 certificate in PEM format.
          example: "-----BEGIN CERTIFICATE-----\nMIIE...\n-----END CERTIFICATE-----"
        allowed_domains:
          type: array
          items:
            type: string
          description: Array of email domains routed to this connection.
          example: ["acme.com"]
        attribute_mapping:
          type: object
          additionalProperties:
            type: string
          description: Map of IdP attributes to engine user fields.
        enforce_sso:
          type: boolean
          description: Flag indicating if SSO is strictly mandatory for allowed_domains.
          example: true
        environment:
          type: string
          enum: [test, live]
          description: Environment that users authenticated through this connection are provisioned into.
          example: live
        created_at:
          type: string
          format: date-time
          description: Timestamp when the connection was created.
          example: '2026-08-06T06:41:59Z'
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the connection was last updated.
          example: '2026-08-06T06:41:59Z'

    DeleteSAMLConnectionResponse:
      type: object
      required:
        - message
        - org_id
      properties:
        message:
          type: string
          example: SAML connection deleted successfully
        org_id:
          type: string
          description: Organization ID whose SAML connection was deleted.
          example: org_aac11dae-f5c
