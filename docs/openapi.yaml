      operationId: processACS
      tags:
      - Enterprise SAML
      description: 'Assertion Consumer Service endpoint for SAML 2.0 Identity Providers.

        Processes SAMLResponse assertions submitted via HTTP POST binding (JSON or URL-encoded form data).

        This is an unauthenticated protocol endpoint; security is guaranteed by XML signature verification and assertion validation.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ACSRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ACSRequest'
      responses:
        '200':
          description: SAML SSO authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ACSResponse'
        '400':
          description: Missing or malformed SAMLResponse payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: missing SAMLResponse payload
                code: missing_parameter
        '403':
          description: SAML assertion validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: SAML assertion could not be validated for this service provider
                code: forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: an internal error occurred while processing this request
                code: internal_error
      security: []
