          type: string
          example: provider removed
        provider:
          type: string
          example: google
    CreateOrgRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Workspace display name
          example: Acme Corp
        slug:
          type: string
          minLength: 2
          maxLength: 50
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: URL-friendly identifier, unique within the tenant and environment (derived from name if omitted)
          example: acme-corp
        logo_url:
          type: string
          maxLength: 2048
          format: uri
          description: Optional workspace logo or avatar URL
          example: https://cdn.example.com/logos/acme.png
        metadata:
          type: object
          additionalProperties: true
          description: Caller-defined attribute bag (max 10KB serialized)
    UpdateOrgRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Replacement workspace display name
        slug:
          type: string
          minLength: 2
          maxLength: 50
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Replacement URL-friendly identifier
        logo_url:
          type: string
          maxLength: 2048
          format: uri
          description: Replacement workspace logo or avatar URL
        metadata:
          type: object
          additionalProperties: true
          description: Replacement attribute bag (replaces metadata wholesale)
    AddMemberRequest:
      type: object
      required:
      - user_id
      - role_id
      properties:
        user_id:
          type: string
          description: Identifier of the user to place in the organization
          example: usr_1a2b3c
        role_id:
          type: string
          description: Role ID or role slug to assign
          example: role_org_admin
    UpdateMemberRoleRequest:
      type: object
      required:
      - role_id
      properties:
        role_id:
          type: string
          description: Replacement role ID or role slug
          example: role_org_member
    CreateInvitationRequest:
      type: object
      required:
      - email
      - role_id
      properties:
        email:
          type: string
          format: email
          description: Target invitee email address
          example: user@example.com
        role_id:
          type: string
          description: Role granted upon invitation acceptance
          example: role_org_member
        expires_hrs:
          type: integer
          default: 168
          minimum: 1
          maximum: 720
          description: Custom invitation validity lifetime in hours (default 7 days / 168 hrs)
          example: 168
    AcceptInvitationRequest:
      type: object
      required:
      - invitation_token
      properties:
        invitation_token:
          type: string
          description: Single-use redemption token from the invitation
          example: inv_tok_9x8v7c6b5a4
    OrgResponse:
      type: object
      required:
      - id
      - tenant_id
      - environment
      - name
      - slug
      - created_at
      properties:
        id:
          type: string
          description: Unique organization ID identifier
          example: org_1a2b3c
        tenant_id:
          type: string
          description: Owning tenant identifier
          example: tnt_live_1234
        environment:
          type: string
          enum:
          - test
          - live
          description: >-
            Environment the workspace belongs to, taken from the credential that
            created it and never from the request. A workspace is visible only to
            keys in its own environment; a cross-environment read answers 404.
          example: test
        name:
          type: string
          description: Workspace display name
          example: Acme Corp
        slug:
          type: string
          description: URL-friendly identifier, unique within the tenant and environment
          example: acme-corp
        logo_url:
          type: string
          description: Workspace logo image URL (omitted if not set)
          example: https://cdn.example.com/logos/acme.png
        metadata:
          type: object
          additionalProperties: true
          description: Custom metadata attributes
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
    OrgMemberResponse:
      type: object
      required:
      - id
      - organization_id
      - user_id
      - role_id
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Unique OrgMember ID identifier
          example: mem_1a2b3c
        organization_id:
          type: string
          description: Owning organization identifier
          example: org_1a2b3c
        user_id:
          type: string
          description: Member user identifier
          example: usr_1a2b3c
        role_id:
          type: string
          description: Assigned role identifier
          example: role_org_member
        assigned_by_user_id:
          type: string
          description: User ID of admin who assigned this role initially (omitted if null)
          example: usr_admin_999
        created_at:
          type: string
          format: date-time
          description: Membership creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Membership last updated timestamp
    OrgInvitationResponse:
      type: object
      required:
      - id
      - organization_id
      - email
      - role_id
      - status
      - expires_at
      - created_at
      properties:
        id:
          type: string
          description: Unique invitation ID identifier
          example: inv_1a2b3c
        organization_id:
          type: string
          description: Organization being joined
          example: org_1a2b3c
        email:
          type: string
          format: email
          description: Invitee email address
          example: user@example.com
        role_id:
          type: string
          description: Role granted on acceptance
          example: role_org_member
        invited_by_user_id:
          type: string
          description: User ID of admin who created invitation
          example: usr_admin_999
        invitation_token:
          type: string
          description: Single-use redemption secret token (returned only on creation, omitted in listings)
          example: inv_tok_9x8v7c6b5a4
        status:
          type: string
          enum:
          - pending
          - accepted
          - expired
          description: Lifecycle state of the invitation
          example: pending
        expires_at:
          type: string
          format: date-time
          description: Expiration timestamp
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
    OrgListResponse:
