openapi: 3.0.3
info:
  title: Authn Platform API
  description: Enterprise Identity Engine REST API specification for authentication, session management, organization multi-tenancy,
    RBAC, SAML, OAuth2/OIDC, Webhooks, API key administration, and account recovery.
  version: 2.0.0
  contact:
    name: Authn Platform Engineering
    url: https://github.com/hanan-bhatti/authn-2.0
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: http://localhost:8080
  description: Local Development Engine
- url: https://api.staging.authn.dev
  description: Staging Environment
- url: https://api.authn.dev
  description: Production Environment
paths:
  /v1/admin/keys:
    post:
      summary: Create API Key
      description: Issues a new API key (publishable or secret) for an application in the caller's tenant. The raw key is
        returned only once in this response.
      operationId: createApiKey
      tags:
      - API Keys (Admin)
      security:
      - SecretKey: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
      responses:
        '201':
          description: API key issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateKeyResponse'
        '400':
          description: Invalid request body, unsupported key type, application mismatch, or environment mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Named application not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      summary: List API Keys
      description: Returns metadata of all API keys belonging to an application in the tenant, including revoked and expired
        keys. Key secret material is never returned.
      operationId: listApiKeys
      tags:
      - API Keys (Admin)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: query
        name: application_id
        schema:
          type: string
        description: Application ID filter (required when caller uses a tenant-wide console JWT)
      responses:
        '200':
          description: List of API key metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyDTO'
        '400':
          description: Missing application_id for tenant-wide admin credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Named application not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/admin/keys/{id}/revoke:
    post:
      summary: Revoke API Key
      description: Marks an API key unusable. Revocation is confined to the caller's own tenant.
      operationId: revokeApiKey
      tags:
      - API Keys (Admin)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Unique API Key ID identifier
      responses:
        '200':
          description: Key revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeKeyResponse'
        '400':
          description: Missing key ID, unknown key, or key already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/admin/users/{user_id}/impersonate:
    post:
      summary: Initiate User Impersonation
      description: Initiates a user support session. When tenant policy demands step-up auth, verification parameters (password,
        totp, or passkey) must be satisfied.
      operationId: initiateImpersonation
      tags:
      - Impersonation (Admin)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
        description: Unique target user ID to impersonate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpersonateRequest'
      responses:
        '200':
          description: Impersonation session token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationResult'
        '400':
          description: Missing user ID, invalid body, missing step-up credentials, user not active, or self-impersonation
            attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Failed step-up password/2FA verification or missing admin authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Impersonation disabled by policy, admin hierarchy violation, missing target opt-in, or missing users:impersonate
            scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target user not found in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation error against tenant impersonation policy limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenant/impersonation-policy:
    get:
      summary: Get Impersonation Policy
      description: Returns the tenant's current user impersonation governance policy settings.
      operationId: getImpersonationPolicy
      tags:
      - Policy (Tenant)
      security:
      - SecretKey: []
      - BearerAuth: []
      responses:
        '200':
          description: Tenant impersonation policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationPolicy'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      summary: Update Impersonation Policy
      description: Updates and persists the tenant's user impersonation policy settings.
      operationId: updateImpersonationPolicy
      tags:
      - Policy (Tenant)
      security:
      - SecretKey: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpersonationPolicy'
      responses:
        '200':
          description: Updated impersonation policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationPolicy'
        '400':
          description: Invalid request JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Policy validation failed (e.g. max_duration_minutes outside 1-60 or invalid email_notification_policy)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/client/auth/impersonate/exit:
    post:
      summary: Exit Impersonation Session
      description: Ends an active support impersonation session client-side and returns impersonator and target user IDs so
        the client can restore the admin session.
      operationId: exitImpersonation
      tags:
      - Impersonation (Client)
      security:
      - PublishableKey: []
      - BearerAuth: []
      responses:
        '200':
          description: Impersonation session exited successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExitImpersonationResponse'
        '400':
          description: Active session is not an impersonation session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing, invalid, or expired session token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenant/password-policy:
    get:
      summary: Get Password Policy
      description: Returns the tenant-level password complexity requirements.
      operationId: getPasswordPolicy
      tags:
      - Policy (Tenant)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: query
        name: tenant_id
        schema:
          type: string
          default: tnt_00000000000000000000000000000001
        description: Target tenant ID
      responses:
        '200':
          description: Tenant password policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicy'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      summary: Update Password Policy
      description: Configures tenant-level password complexity requirements.
      operationId: updatePasswordPolicy
      tags:
      - Policy (Tenant)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: query
        name: tenant_id
        schema:
          type: string
          default: tnt_00000000000000000000000000000001
        description: Target tenant ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicy'
      responses:
        '200':
          description: Updated password policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicy'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenant/security-policy:
    get:
      summary: Get Security Policy
      description: Returns tenant-level security enforcement settings (email verification, token reuse policy).
      operationId: getSecurityPolicy
      tags:
      - Policy (Tenant)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: query
        name: tenant_id
        schema:
          type: string
          default: tnt_00000000000000000000000000000001
        description: Target tenant ID
      responses:
        '200':
          description: Tenant security policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicy'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      summary: Update Security Policy
      description: Updates tenant-level security enforcement settings.
      operationId: updateSecurityPolicy
      tags:
      - Policy (Tenant)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: query
        name: tenant_id
        schema:
          type: string
          default: tnt_00000000000000000000000000000001
        description: Target tenant ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityPolicy'
      responses:
        '200':
          description: Updated security policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicy'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenant/recovery-policy:
    get:
      summary: Get Recovery Policy
      description: Returns tenant-level account recovery rules (proof methods, freeze windows, lockout schedule).
      operationId: getRecoveryPolicy
      tags:
      - Policy (Tenant)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: query
        name: tenant_id
        schema:
          type: string
          default: tnt_00000000000000000000000000000001
        description: Target tenant ID
      responses:
        '200':
          description: Tenant recovery policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryPolicy'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      summary: Update Recovery Policy
      description: Configures tenant-level account recovery rules. Policy bounds are strictly validated.
      operationId: updateRecoveryPolicy
      tags:
      - Policy (Tenant)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: query
        name: tenant_id
        schema:
          type: string
          default: tnt_00000000000000000000000000000001
        description: Target tenant ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryPolicy'
      responses:
        '200':
          description: Updated recovery policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryPolicy'
        '400':
          description: Invalid request body or recovery policy bounds rejection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenant/roles:
    post:
      summary: Create Tenant Role
      description: Creates a new custom RBAC role with permissions in a tenant.
      operationId: createRole
      tags:
      - RBAC (Tenant)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: query
        name: tenant_id
        schema:
          type: string
        description: Target tenant ID (overridden if provided in request body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Role with this name or slug already exists in tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Permission format, action verb, or tenant policy restriction validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      summary: List Tenant Roles
      description: Returns every role defined in a tenant alongside its permissions.
      operationId: listRoles
      tags:
      - RBAC (Tenant)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: query
        name: tenant_id
        schema:
          type: string
          default: tnt_00000000000000000000000000000001
        description: Target tenant ID
      responses:
        '200':
          description: List of tenant roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenant/roles/{role_id}/permissions:
    put:
      summary: Update Role Permissions
      description: Replaces the complete permission set for a specified tenant role.
      operationId: updateRolePermissions
      tags:
      - RBAC (Tenant)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: path
        name: role_id
        required: true
        schema:
          type: string
        description: Unique role ID identifier
      - in: query
        name: tenant_id
        schema:
          type: string
          default: tnt_00000000000000000000000000000001
        description: Target tenant ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolePermissionsRequest'
      responses:
        '200':
          description: Permissions updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRolePermissionsResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Permission format, action verb, or tenant policy restriction validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/admin/users/{user_id}/roles:
    post:
      summary: Assign User Role
      description: Grants an RBAC role (by slug) to a target user within a tenant.
      operationId: assignUserRole
      tags:
      - RBAC (Admin)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
        description: Unique user ID to assign the role to
      - in: query
        name: tenant_id
        schema:
          type: string
          default: tnt_00000000000000000000000000000001
        description: Target tenant ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRoleRequest'
      responses:
        '200':
          description: Role assigned to user successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignUserRoleResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Target user or role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: User already possesses this role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/admin/users/{user_id}/roles/{role_slug}:
    delete:
      summary: Revoke User Role
      description: Revokes an assigned RBAC role (by slug) from a user within a tenant.
      operationId: revokeUserRole
      tags:
      - RBAC (Admin)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: string
        description: Unique user ID
      - in: path
        name: role_slug
        required: true
        schema:
          type: string
        description: Role slug identifier to revoke
      - in: query
        name: tenant_id
        schema:
          type: string
          default: tnt_00000000000000000000000000000001
        description: Target tenant ID
      responses:
        '200':
          description: Role revoked from user successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeUserRoleResponse'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/client/user/permissions:
    get:
      summary: Get User Permissions
      description: Returns the authenticated calling user's assigned role slugs and effective permissions union.
      operationId: getUserPermissions
      tags:
      - RBAC (Client)
      security:
      - PublishableKey: []
      - BearerAuth: []
      responses:
        '200':
          description: Caller's roles and effective permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPermissionsResponse'
        '401':
          description: Missing publishable key or unauthenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/admin/webhooks/endpoints:
    post:
      summary: Create Webhook Endpoint
      description: Registers a new webhook endpoint. The generated signing secret is returned ONLY ONCE in this response.
      operationId: createWebhookEndpoint
      tags:
      - Webhooks (Admin)
      security:
      - SecretKey: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpointRequest'
      responses:
        '201':
          description: Webhook endpoint registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointResponse'
        '400':
          description: Invalid request JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid HTTPS URL, empty/invalid events, or unsupported event type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      summary: List Webhook Endpoints
      description: Returns every webhook endpoint registered by the tenant. Secrets are excluded.
      operationId: listWebhookEndpoints
      tags:
      - Webhooks (Admin)
      security:
      - SecretKey: []
      - BearerAuth: []
      responses:
        '200':
          description: List of registered webhook endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointListResponse'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/admin/webhooks/endpoints/{id}:
    get:
      summary: Get Webhook Endpoint
      description: Retrieves details of a single registered webhook endpoint by ID.
      operationId: getWebhookEndpoint
      tags:
      - Webhooks (Admin)
      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Unique webhook endpoint ID
      responses:
        '200':
          description: Webhook endpoint details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointResponse'
