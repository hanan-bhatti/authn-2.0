      - in: header
        name: X-Authn-Client-Type
        required: false
        schema:
          type: string
          enum:
          - web
          - native
          - mobile
          default: web
        description: Client platform type. Controls whether refresh token is returned in response body or HttpOnly cookie.
      - in: query
        name: mfa_token
        required: false
        schema:
          type: string
        description: MFA token (can alternatively be passed in request body)
      - in: query
        name: session_id
        required: false
        schema:
          type: string
        description: Assertion ceremony session ID (can alternatively be passed in request body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnLoginFinishRequest'
      responses:
        '200':
          description: Passkey authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Missing mfa_token/session_id or invalid assertion response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
