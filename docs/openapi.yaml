  /v1/client/auth/signup:
    post:
      summary: Client User Registration
      description: Registers a new user identity with email and password, subject to password policy enforcement and rate
        limiting.
      operationId: clientSignUp
      tags:
      - Authentication
      security:
      - PublishableKey: []
      parameters:
      - in: header
        name: X-Authn-Client-Type
        required: false
        schema:
          type: string
          enum:
          - web
          - native
          - mobile
          default: web
        description: Identifies the client platform type. Native/mobile clients receive the refresh token in the response
          body; web clients receive it via an HttpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request body, missing required fields, invalid email format, name exceeding 255 chars, or password
            policy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid publishable API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Code `test_quota_exceeded`. The tenant already holds TEST_MAX_USERS
            users in the test environment. Live credentials are not bounded by
            this ceiling. Not 429 — waiting does not help, because the ceiling is
            on stored rows; room is made by deleting users or using a live key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: User with the specified email address already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Request throttled due to rate limiting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/client/auth/login:
