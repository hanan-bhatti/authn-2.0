          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  example: tnt_demo123
                environment:
                  type: string
                  example: test
                email:
                  type: string
                  format: email
                  example: user@example.com
              required:
              - email
      responses:
        '200':
          description: Verification email request processed
          content:
            application/json:
              schema:
