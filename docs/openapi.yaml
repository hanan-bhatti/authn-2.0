          application/json:
            schema:
              type: object
              required:
              - recovery_request_id
              - share_payload
              properties:
                recovery_request_id:
                  type: string
                  example: req_1a2b3c
                  description: Recovery request ID returned by initiate
                share_payload:
                  type: string
                  example: 0102030405060708090a0b0c0d0e0f10
                  description: Hex-encoded raw Shamir secret share
