        '403':
          description: Forbidden / Admin permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    PublishableKey:
      type: apiKey
      name: X-Authn-Publishable-Key
      in: header
      description: Client publishable key identifying application context
    SecretKey:
      type: apiKey
      name: X-Authn-Secret-Key
      in: header
      description: Backend secret key for tenant admin API calls
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Client user or console admin session JWT
  schemas:
    CreateKeyRequest:
      type: object
      required:
      - name
      - type
      properties:
        application_id:
          type: string
          example: app_00000000000000000000000000000001
          description: Owning application ID. Required for console JWT callers, optional for sk_ callers.
        name:
          type: string
          example: Production Stripe Webhook Key
          description: Operator-facing label for the key
        type:
          type: string
          enum:
          - publishable
          - secret
          example: publishable
          description: Scope of the key
        environment:
          type: string
          enum:
          - test
          - live
          example: test
          description: Mode environment matching the caller
        expires_in_days:
          type: integer
          example: 30
          description: Optional validity duration in days
    KeyDTO:
      type: object
      required:
      - id
      - application_id
      - name
      - type
      - key_prefix
      - environment
      - created_at
      properties:
        id:
          type: string
          example: key_1a2b3c
        application_id:
          type: string
          example: app_00000000000000000000000000000001
        name:
          type: string
          example: Production Key
        type:
          type: string
          example: publishable
        key_prefix:
          type: string
          example: pk_test_
        environment:
          type: string
          example: test
        created_at:
          type: string
          format: date-time
          example: '2026-08-01T12:00:00Z'
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-31T12:00:00Z'
        revoked_at:
          type: string
          format: date-time
          nullable: true
          example: null
    CreateKeyResponse:
      type: object
      required:
      - key
      - raw_key
      properties:
        key:
          $ref: '#/components/schemas/KeyDTO'
        raw_key:
          type: string
          example: pk_test_12345678901234567890123456789012
          description: Usable API key string; returned only once on creation
    RevokeKeyResponse:
      type: object
      required:
      - status
      - id
      properties:
        status:
          type: string
          example: revoked
        id:
          type: string
          example: key_1a2b3c
    ImpersonateRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          example: Investigating billing issue reported in support ticket
          description: Justification string (10 to 500 characters)
        duration_minutes:
          type: integer
          example: 15
          description: Requested session length in minutes (clamped to tenant policy max)
        ticket_id:
          type: string
          example: TICKET-10492
          description: Optional support ticket reference (3 to 100 characters)
        verification_method:
          type: string
          enum:
          - password
          - totp
          - webauthn
          - passkey
          example: password
          description: Step-up authentication method presented by the admin
        mfa_code:
          type: string
          example: '123456'
          description: TOTP 2FA verification code
        admin_password:
          type: string
          example: AdminSecretPassword123!
          description: Admin's own password for step-up verification
        credential_id:
          type: string
          example: cred_webauthn_99
          description: WebAuthn passkey credential identifier
    UserInfo:
      type: object
      required:
      - id
      - email
      - status
      - email_verified
      properties:
        id:
          type: string
          example: usr_1a2b3c
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          nullable: true
          example: Jane Doe
        status:
          type: string
          example: active
        email_verified:
          type: boolean
          example: true
    ImpersonationResult:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - impersonated_user
      - impersonator_id
      - session_id
      properties:
        access_token:
          type: string
          description: Impersonated JWT access token
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
          description: Token lifetime in seconds
        impersonated_user:
          $ref: '#/components/schemas/UserInfo'
        impersonator_id:
          type: string
          example: usr_admin_99
        session_id:
          type: string
          example: ses_imp_1750000000000000000
    ImpersonationPolicy:
      type: object
      required:
      - enabled
      - max_duration_minutes
      - require_step_up_auth
      - require_ticket_id
      - require_user_opt_in
      - email_notification_policy
      - read_only_default
      - restrict_admin_impersonation
      - allowed_roles
      properties:
        enabled:
          type: boolean
          example: true
        max_duration_minutes:
          type: integer
          minimum: 1
          maximum: 60
          example: 15
        require_step_up_auth:
          type: boolean
          example: true
        require_ticket_id:
          type: boolean
          example: false
        require_user_opt_in:
          type: boolean
          example: false
        email_notification_policy:
          type: string
          enum:
          - IMMEDIATE
          - POST_SESSION
          - DISABLED
          example: IMMEDIATE
        read_only_default:
          type: boolean
          example: false
        restrict_admin_impersonation:
          type: boolean
          example: true
        allowed_roles:
          type: array
          items:
            type: string
          example:
          - tenant_admin
          - support_admin
    ExitImpersonationResponse:
      type: object
      required:
      - message
      - impersonated_id
      - impersonator_id
      properties:
        message:
          type: string
          example: impersonation session exited successfully
        impersonated_id:
          type: string
          example: usr_target_123
        impersonator_id:
          type: string
          example: usr_admin_99
    EnvironmentEnvelope:
      type: object
      required:
      - environment
      properties:
        environment:
          type: string
          enum:
          - test
          - live
          description: >-
            The environment this response describes, echoed from the credential that
            authenticated the request. A sk_test_ key reads and writes test settings, a
            sk_live_ key live ones, and there is no way to reach one environment while
            holding the other's key. It is echoed because "I changed the policy and
            nothing happened" is otherwise indistinguishable from having configured the
            other environment by mistake.
          example: test
    SessionPolicy:
      type: object
      required:
      - cookie_same_site
      - access_token_ttl_minutes
      - refresh_token_ttl_days
      properties:
        cookie_same_site:
          type: string
          enum:
          - lax
          - none
          description: >-
            SameSite attribute of the refresh cookie. Use lax when your applications sit
            under one parent domain; none is required when the browser must send the cookie
            to a genuinely different site, and pairs with Secure. Requesting none is stored
            as asked but honoured only when the cookie will also carry Secure; over plaintext
            HTTP the cookie is written Lax instead, because browsers drop a non-Secure
            SameSite=None cookie outright and a same-site session beats no session.
          example: lax
        access_token_ttl_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: >-
            Access token lifetime in minutes. Zero inherits the deployment default. Values
            outside the range are clamped into it rather than rejected, so a policy write
            never fails on a number an administrator can simply be shown the effect of.
          example: 15
        refresh_token_ttl_days:
          type: integer
          minimum: 1
          maximum: 365
          description: >-
            How long a session may be refreshed before the person signs in again. Zero
            inherits the deployment default, and out-of-range values are clamped.
          example: 30
    TenantSettings:
      type: object
      description: >-
        Every policy column of one environment's settings row, as stored. A column absent
        or empty means nothing has been configured and the engine's defaults apply, which
        is why no column is required here. Each social provider's client secret is replaced
        by a client_secret_set boolean.
      properties:
        branding_config:
          type: object
          additionalProperties: true
          description: Hosted-page branding for this environment.
        password_policy:
          type: object
          additionalProperties: true
          description: Password complexity requirements. Shaped like PasswordPolicy.
        security_policy:
          type: object
          additionalProperties: true
          description: Security enforcement settings. Shaped like SecurityPolicy.
        recovery_policy:
          type: object
          additionalProperties: true
          description: Account recovery rules. Shaped like RecoveryPolicy.
        social_providers:
          type: object
          additionalProperties: true
          description: >-
            Social provider configuration keyed by provider, with each client secret
            replaced by client_secret_set. Configuring a provider in test does not
            configure it in live; each environment holds its own OAuth client.
        role_policy:
          type: object
          additionalProperties: true
          description: Default role assignment for members created in this environment.
        session_policy:
          type: object
          additionalProperties: true
          description: Session and cookie settings. Shaped like SessionPolicy.
    TenantSettingsResponse:
      type: object
      required:
      - environment
      - settings
      properties:
        environment:
          type: string
          enum:
          - test
          - live
          description: Environment the settings belong to, taken from the credential.
          example: test
        settings:
          $ref: '#/components/schemas/TenantSettings'
    TenantSettingsDiffResponse:
      type: object
      required:
      - environment
      - test
      - live
      - differs
      properties:
        environment:
          type: string
          enum:
          - test
          - live
          description: >-
            Environment of the credential that made the request. Both environments are
            returned whichever key was used, since comparing them is the point.
          example: test
        test:
          $ref: '#/components/schemas/TenantSettings'
        live:
          $ref: '#/components/schemas/TenantSettings'
        differs:
          type: array
          items:
            type: string
          description: >-
            Names of the policy columns whose stored values differ between the two
            environments, in a stable order. This is exactly what publishing test would
            change in live. An empty array means the two environments already match.
          example:
          - password_policy
          - session_policy
    PublishSettingsRequest:
      type: object
      description: >-
        Names the environments a publish moves settings between. The body may be omitted
        entirely, which means test to live.
      properties:
        from:
          type: string
          enum:
          - test
          - live
          default: test
          description: Environment whose settings are copied. Read across the boundary, since a publish that could not read test could not publish anything.
          example: test
        to:
          type: string
          enum:
          - test
          - live
          default: live
          description: >-
            Environment overwritten. Must match the environment of the key making the
            request, so publishing into live requires a sk_live_ key. That is the guard
            that stops a test key overwriting a live configuration. Must also differ from
            from, because copying an environment onto itself would stamp a promotion in the
            audit trail that never happened.
          example: live
    PublishSettingsResponse:
      type: object
      required:
      - message
      - from
      - to
      - changed
      - settings
      properties:
        message:
          type: string
          example: settings published
        from:
          type: string
          enum:
          - test
          - live
          example: test
        to:
          type: string
          enum:
          - test
          - live
          example: live
        changed:
          type: array
          items:
            type: string
          description: >-
            Names of the columns the publish altered, measured against the destination as
            it stood before the write. An empty array means the destination already matched
            the source, so the publish recorded itself and changed nothing else. Only names
            are reported and never values, because the values include provider secrets.
          example:
          - password_policy
          - session_policy
        settings:
          allOf:
          - $ref: '#/components/schemas/TenantSettings'
          description: What the destination now holds, which is a verbatim copy of the source.
    SandboxMessage:
      type: object
      required:
      - id
      - channel
      - environment
      - recipient
      - created_at
      properties:
        id:
          type: string
          example: sbxmsg_2f9c1a7b4e0d
        channel:
          type: string
          enum:
          - email
          - sms
          example: email
        environment:
          type: string
          enum:
          - test
          - live
          description: >-
            Always test in practice. The column exists so this table is narrowed by the same
            interceptor predicate as every other environment-scoped one, which is what stops a
            live key reading sandbox traffic.
          example: test
        recipient:
          type: string
          description: The address the message was aimed at — an email address, or E.164 for SMS.
          example: ada@example.test
        subject:
          type: string
          description: Absent for SMS, which has none.
          example: Verify your email address
        template:
          type: string
          enum:
          - email_verification
          - magic_link
          - two_factor_code
          - impersonation_notice
          - email_change
          - recovery_email_verification
          description: >-
            Which template produced the message, classified from the subject using the sender's
            own subject constants. An unrecognised subject stores an empty value rather than a
            guess: this field exists so a test can assert which message was triggered, and a
            wrong answer would defeat that more thoroughly than an absent one.
          example: email_verification
        code:
          type: string
          description: >-
            The one-time code, lifted out at capture time so completing a flow does not mean
            parsing rendered HTML. Read from the plain-text alternative in preference to the
            HTML one, since both carry the same code and only one is wrapped in a stylesheet.
            Absent when the message carries none.
          example: '482915'
        metadata:
          type: object
          additionalProperties: true
          description: >-
            link is the action URL carrying the authenticating token; text_body is the
            plain-text alternative of an email.
          example:
            link: https://api.authn.com/v1/client/auth/verify-email?token=32b3c1b7a1695dbb
            text_body: Welcome to Acme! Please verify your email address...
        body:
          type: string
          description: >-
            The message exactly as the provider would have received it. Returned only on a
            single-message read, never in a listing.
          example: <!DOCTYPE html><html>...</html>
        created_at:
          type: string
          format: date-time
          example: '2026-08-19T11:04:22Z'
    SandboxMessageListResponse:
      type: object
      required:
      - environment
      - messages
      - total
      properties:
        environment:
          type: string
          enum:
          - test
          description: Environment the inbox belongs to, taken from the credential.
          example: test
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SandboxMessage'
          description: One page of captures, newest first, so messages[0] is what the flow just triggered produced. body is omitted here.
        total:
          type: integer
          description: >-
            Every message matching the filter, counted before paging. A test polling for a
            message cannot learn this from the page length, which is why it is reported
            separately.
          example: 2
    SandboxMessageResponse:
      type: object
      required:
      - environment
      - message
      properties:
        environment:
          type: string
          enum:
          - test
          example: test
        message:
          allOf:
          - $ref: '#/components/schemas/SandboxMessage'
          description: The capture including its rendered body.
    SandboxPurgeResponse:
      type: object
      required:
      - message
      - environment
      - removed
      properties:
        message:
          type: string
          example: sandbox inbox emptied
        environment:
          type: string
          enum:
          - test
          example: test
        removed:
          type: integer
          description: Captures deleted. Only the calling tenant's test messages are touched.
          example: 12
    VerifyDeliveryRequest:
      type: object
      required:
      - channel
      description: >-
        Notably absent is a recipient. The address is the signed-in operator's own, which makes
        it impossible to aim this endpoint at somebody else rather than merely against the
        rules — and a check of whether a provider accepts mail does not need a choice of target
        to answer.
      properties:
        channel:
          type: string
          enum:
          - email
          - sms
          description: Which configured driver to exercise.
          example: email
    VerifyDeliveryResponse:
      type: object
      required:
      - message
      - channel
      - recipient
      - driver
      properties:
        message:
          type: string
          example: delivery test accepted by the provider
        channel:
          type: string
          enum:
          - email
          - sms
          example: email
        recipient:
          type: string
          description: The operator's own verified email address or phone number, read from their account.
          example: operator@acme.com
        driver:
          type: string
          description: The configured backend that accepted the message.
          example: aws_ses
    PasswordPolicy:
      type: object
      required:
      - enforcement_mode
      - require_uppercase
      - require_lowercase
      - require_numeric
      - require_special
      - force_upgrade_on_signin
      - min_length
      - max_length
      properties:
        enforcement_mode:
          type: string
          enum:
          - require
          - notify
          example: require
        require_uppercase:
          type: boolean
          example: false
        require_lowercase:
          type: boolean
          example: false
        require_numeric:
          type: boolean
          example: true
        require_special:
          type: boolean
          example: false
        force_upgrade_on_signin:
          type: boolean
          example: false
        min_length:
          type: integer
          minimum: 8
          example: 8
        max_length:
          type: integer
          maximum: 4096
          example: 4096
    SecurityPolicy:
      type: object
      required:
      - require_email_verification
      - email_verification_mode
      - token_reuse_policy
      properties:
        require_email_verification:
          type: boolean
          example: false
        email_verification_mode:
          type: string
          enum:
          - hard
          - soft
          example: soft
        token_reuse_policy:
          type: string
          enum:
          - global_revoke
          - session_revoke
          example: global_revoke
    RecoveryPolicy:
      type: object
      required:
      - guardians_enabled
      - phone_otp_enabled
      - email_otp_enabled
      - old_password_enabled
      - security_questions_enabled
      - freeze_window_hours
      - claim_token_ttl_minutes
      - lockout_schedule
      - lockout_reset_days
      - trusted_device_window_days
      - min_guardians
      - max_guardians
      - ipv4_subnet_bits
      - ipv6_subnet_bits
      - max_proof_attempts_per_window
      properties:
        guardians_enabled:
          type: boolean
          example: true
        phone_otp_enabled:
          type: boolean
          example: true
        email_otp_enabled:
          type: boolean
          example: true
        old_password_enabled:
          type: boolean
          example: true
        security_questions_enabled:
          type: boolean
          example: true
        freeze_window_hours:
          type: integer
          minimum: 24
          maximum: 168
          example: 48
        claim_token_ttl_minutes:
          type: integer
          minimum: 5
          maximum: 60
          example: 15
        lockout_schedule:
          type: array
          items:
            type: string
          example:
          - 24h
          - 3d
          - 7d
          - 14d
          - 4w
          - 8w
          - 12w
          - permanent
        lockout_reset_days:
          type: integer
          minimum: 7
          maximum: 90
          example: 30
        trusted_device_window_days:
          type: integer
          minimum: 30
          maximum: 365
          example: 90
        min_guardians:
          type: integer
          minimum: 1
          example: 1
        max_guardians:
          type: integer
          maximum: 5
          example: 5
        ipv4_subnet_bits:
          type: integer
          minimum: 16
          maximum: 30
          example: 24
        ipv6_subnet_bits:
          type: integer
          minimum: 32
          maximum: 64
          example: 48
        max_proof_attempts_per_window:
          type: integer
          minimum: 1
          maximum: 10
          example: 3
    Branding:
      type: object
      description: A tenant's presentational configuration. Every field is public and every field may be empty; empty means
        the client inherits its own defaults rather than that a required value is missing. The stored column is a free-form
        JSON object shared with settings that are not public, and it is narrowed by unmarshalling into this fixed shape, so
        a key added to the column for another purpose cannot reach the public document.
      properties:
        app_name:
          type: string
          maxLength: 100
          description: Product name on the sign-in card. Empty means fall back to the application or tenant name.
          example: Acme Identity
        logo_url:
          type: string
          description: 'Primary logo. http(s) only; the javascript: and data: schemes are refused.'
          example: https://cdn.acme.example/logo.svg
        logo_dark_url:
          type: string
          description: Dark-scheme counterpart to logo_url.
          example: https://cdn.acme.example/logo-dark.svg
        favicon_url:
          type: string
          example: https://cdn.acme.example/favicon.ico
        primary_color:
          type: string
          pattern: ^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          description: Accent applied to buttons and links. Hex only, because the value is interpolated into a stylesheet
            and a free-form CSS colour can carry a whole declaration.
          example: '#1a73e8'
        background_color:
          type: string
          pattern: ^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          example: '#ffffff'
        text_color:
          type: string
          pattern: ^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          example: '#0f172a'
        button_text_color:
          type: string
          pattern: ^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          example: '#ffffff'
        font_family:
          type: string
          maxLength: 200
          description: CSS font-family list, without the property name or terminating semicolon. The characters ; { } < >
            are refused, since they are what let a value end one declaration and begin another.
          example: Inter, -apple-system, sans-serif
        support_url:
          type: string
          example: https://acme.example/support
        terms_url:
          type: string
          example: https://acme.example/terms
        privacy_url:
          type: string
          example: https://acme.example/privacy
        custom_css:
          type: string
          maxLength: 16384
          description: Appended to the hosted stylesheet. The characters < and > are refused, because the stylesheet is delivered
            inside a style element and a payload containing "</style><script>" would close it and execute.
          example: '.authn-card { border-radius: 12px }'
    ApplicationInfo:
      type: object
      description: The calling application's public identity. Its allowed CORS origins and exact redirect URIs are deliberately
        absent - they are the allowlists an open-redirect attempt is measured against.
      properties:
        id:
          type: string
          example: app_00000000000000000000000000000001
        name:
          type: string
          example: Acme Web
        environment:
          type: string
          enum:
          - test
          - live
          description: Taken from the key rather than the request, so a client is told which environment its own credential
            addresses. Renders a test-mode banner.
          example: test
    TenantInfo:
      type: object
      description: The owning workspace's public identity - what a sign-in page may display, and nothing more.
      properties:
        name:
          type: string
          example: Acme Corp
        slug:
          type: string
          example: acme
    SignInMethods:
      type: object
      description: The first factors a sign-in page should offer. Several fields are unconditionally true; they describe the
        surface the engine compiles in, and are reported rather than assumed so a client reads every capability from one place
        instead of splitting the question between what it asks the server and what it hardcodes.
      properties:
        password:
          type: boolean
          description: Always true. The engine's base credential, with no switch.
          example: true
        magic_link:
          type: boolean
          description: Follows the deployment's FEATURE_MAGIC_LINK_ENABLED flag.
          example: true
        passkey:
          type: boolean
          description: Always true. The WebAuthn relying party is always configured, defaulting to the deployment host.
          example: true
        enterprise_sso:
          type: boolean
          description: True when the tenant has at least one SAML connection, which is what makes an SSO option worth showing.
            Which connection serves a given user is resolved per email domain by POST /v1/client/auth/domain-lookup, since
            that depends on an address the user has not typed yet.
          example: false
        social_providers:
          type: array
          description: Names of the providers the tenant has enabled, sorted so a cacheable response does not differ between
            reads. Names only - the engine performs the authorization redirect itself, so a browser never needs a provider's
            client ID. Always an array, never null.
          items:
            type: string
          example:
          - github
          - google
    SecondFactors:
      type: object
      description: The second factors a tenant's users may hold, so a page can label an MFA challenge before it knows which
        factor the user enrolled.
      properties:
        totp:
          type: boolean
          description: Authenticator-app codes. Always true.
          example: true
        sms:
          type: boolean
          description: Requires the deployment to name a real SMS driver. A tenant can enable phone codes on a deployment
            that cannot deliver a text; offering the factor there produces a code that never arrives.
          example: false
        passkey:
          type: boolean
          description: WebAuthn as a second factor. Always true.
          example: true
        recovery_codes:
          type: boolean
          description: Single-use backup codes. Always true.
          example: true
        push:
          type: boolean
          description: Follows the deployment's FEATURE_PUSH_2FA_ENABLED flag.
          example: false
    PasswordRules:
      type: object
      description: The password policy as a client should apply it. The lengths are the effective bounds the engine will enforce,
        not the stored ones - a tenant may store a minimum below the engine's own floor, and publishing that would produce
        a form accepting a password the API then rejects.
      properties:
        min_length:
          type: integer
          example: 8
        max_length:
          type: integer
          example: 4096
        require_uppercase:
          type: boolean
          example: false
        require_lowercase:
          type: boolean
          example: false
        require_numeric:
          type: boolean
          example: true
        require_special:
          type: boolean
          example: false
        enforced:
          type: boolean
          description: Whether a non-compliant password is refused. False means the tenant is in notify mode - the password
            is accepted and the unmet criteria reported, so a page should warn rather than block. The policy's require and
            notify modes collapse to this one flag because a client only needs to know whether to block or to warn.
          example: true
    EmailVerification:
      type: object
      description: How the tenant treats a user whose address is unverified, which decides what a page does after a successful
        sign-up.
      properties:
        required:
          type: boolean
          example: false
        mode:
          type: string
          enum:
          - soft
          - hard
          description: hard refuses an unverified user access, so a page shows a blocking screen. soft admits them with the
            state flagged on the token, so a page shows a dismissible banner. Reported as soft when the stored value is empty,
            which is both the documented default and the permissive of the two.
          example: soft
    AccountRecovery:
      type: object
      description: Which proofs a locked-out user may offer, so the "can't sign in?" flow can render its options. The recovery
        policy's thresholds - lockout schedule, reset window, freeze window, claim-token TTL, trusted-device window, per-window
        attempt cap and the subnet widths attempts are grouped by - are absent by design, because an attacker who can read
        them can pace an attempt to stay under every one.
      properties:
        guardians:
          type: boolean
          example: true
        phone_otp:
          type: boolean
          description: Additionally requires the deployment to name a real SMS driver, since a tenant can enable the method
            on a deployment that cannot deliver a text.
          example: false
        email_otp:
          type: boolean
          example: true
        old_password:
          type: boolean
          example: true
        security_questions:
          type: boolean
          example: true
        min_guardians:
          type: integer
          description: Bounds the enrolment screen validates against before submitting.
          example: 1
        max_guardians:
          type: integer
          example: 5
    AppConfig:
      type: object
      description: The document a sign-in page fetches once, before it renders, to learn how it should look, which sign-in
        options to offer, and what it may accept as a password. It answers all three in one round trip because a page making
        three calls would render three times, and because two of the three are policies the client must agree with the server
        about. Every member is an explicit projection rather than a stored policy struct, so a field reaches this API only
        when someone puts it here on purpose.
      properties:
        application:
          $ref: '#/components/schemas/ApplicationInfo'
        tenant:
          $ref: '#/components/schemas/TenantInfo'
        branding:
          $ref: '#/components/schemas/Branding'
        sign_in_methods:
          $ref: '#/components/schemas/SignInMethods'
        second_factors:
          $ref: '#/components/schemas/SecondFactors'
        password_rules:
          $ref: '#/components/schemas/PasswordRules'
        email_verification:
          $ref: '#/components/schemas/EmailVerification'
        account_recovery:
          $ref: '#/components/schemas/AccountRecovery'
