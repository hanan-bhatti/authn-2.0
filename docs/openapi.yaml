      - User Self-Service
      description: 'Registers a secondary recovery email address and sends a confirmation link to it.

        '
      security:
      - PublishableKey: []
        BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRecoveryEmailRequest'
      responses:
        '200':
          description: Recovery email verification link sent
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
                    example: secondary recovery email verification link sent
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: recovery email could not be set
                code: validation_failed
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      summary: Remove Secondary Recovery Email Address
      operationId: deleteRecoveryEmail
      tags:
      - User Self-Service
      description: 'Removes the secondary recovery email address from the caller''s account.

        '
      security:
      - PublishableKey: []
        BearerAuth: []
      responses:
        '200':
          description: Recovery email removed successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
                    example: secondary recovery email removed successfully
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
