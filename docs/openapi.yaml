      description: 'Returns all OAuth / social identities linked to the caller''s account.

        '
      security:
      - PublishableKey: []
        BearerAuth: []
      responses:
        '200':
          description: Linked social accounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - social_accounts
                properties:
                  social_accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/LinkedSocialAccount'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/client/user/social-accounts/{provider}:
    delete:
      summary: Unlink Social Account Provider
      operationId: unlinkSocialAccount
      tags:
      - User Self-Service
      description: 'Disconnects an OAuth provider from the caller''s account. Refuses to unlink if it is the only login method.

        '
      parameters:
      - name: provider
        in: path
        required: true
        description: Social authentication provider name (e.g. google, github)
        schema:
          type: string
      security:
      - PublishableKey: []
        BearerAuth: []
      responses:
        '200':
          description: Social account unlinked successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - provider
                - message
                properties:
                  provider:
                    type: string
                    example: google
                  message:
                    type: string
                    example: social account unlinked successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: social account could not be unlinked
                code: validation_failed
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Cannot unlink sole authentication method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: 'cannot unlink social account: user has no password set and this is the only login method'
                code: forbidden
        '404':
          description: Social provider not linked to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: social provider is not connected to this account
                code: not_found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/client/user/account:
    delete:
      summary: Permanently Delete User Account
      operationId: deleteAccount
      tags:
      - User Self-Service
      description: 'Permanently erases the caller''s account. Re-authenticates with current password before erasure if configured.

        '
      security:
      - PublishableKey: []
        BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: Account permanently deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
                    example: user account deleted permanently
        '401':
          description: Unauthorized or incorrect password confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: incorrect current password
                code: invalid_credentials
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/client/sessions:
    get:
      summary: List Authenticated User Active Sessions
      operationId: listSessions
      tags:
      - Session Management
      description: 'Returns the calling user''s active sessions, flagging which session processed this request.

        '
      security:
      - PublishableKey: []
        BearerAuth: []
      responses:
        '200':
          description: List of active sessions
          content:
            application/json:
              schema:
                type: object
                required:
                - sessions
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: 'session authentication required: missing or invalid access token'
                code: unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/client/sessions/revoke:
    post:
      summary: Revoke Specific User Session
      operationId: revokeSession
      tags:
      - Session Management
      description: 'Revokes a single active session belonging to the caller specified in the request body.

        '
      security:
      - PublishableKey: []
        BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionRequest'
      responses:
        '200':
          description: Session revoked successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - session_id
                properties:
                  message:
                    type: string
                    example: session revoked
                  session_id:
                    type: string
                    example: sess_01H1234567890ABCDEF
        '400':
          description: Missing session_id parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: session_id is required
                code: missing_parameter
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: 'session authentication required: missing or invalid access token'
                code: unauthorized
        '403':
          description: Session belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: session does not belong to the calling user
                code: forbidden
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: session not found
                code: not_found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/client/sessions/revoke-others:
    post:
      summary: Revoke Other User Sessions
      operationId: revokeOtherSessions
      tags:
      - Session Management
      description: 'Revokes all active sessions belonging to the caller except the session executing this request.

        '
      security:
      - PublishableKey: []
        BearerAuth: []
      responses:
        '200':
          description: Other sessions revoked successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - count
                properties:
                  message:
                    type: string
                    example: all other sessions revoked
                  count:
                    type: integer
                    example: 2
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: 'session authentication required: missing or invalid access token'
                code: unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/client/sessions/revoke-all:
    post:
      summary: Revoke All User Sessions
      operationId: revokeAllSessions
      tags:
      - Session Management
      description: 'Revokes every session belonging to the caller, including the current active session.

        '
      security:
      - PublishableKey: []
        BearerAuth: []
      responses:
        '200':
          description: All sessions revoked successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - count
                properties:
                  message:
                    type: string
                    example: all sessions revoked
                  count:
                    type: integer
                    example: 3
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: 'session authentication required: missing or invalid access token'
                code: unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/client/auth/refresh:
    post:
      summary: Refresh Access Token
      operationId: refreshTokens
      tags:
      - Session Management
      description: 'Exchanges a refresh token (supplied in JSON request body or `authn_refresh_token` HTTP cookie) for a new
        access token and rotated refresh token.

        '
      security:
      - PublishableKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokensRequest'
      responses:
        '200':
          description: Token pair refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokenPairResponse'
        '400':
          description: Missing refresh token parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: refresh_token required
                code: missing_parameter
        '401':
          description: Refresh token invalid, expired, revoked, or compromised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                session_compromised:
                  summary: Token reuse detected / session compromised
                  value:
                    error: session revoked due to token reuse detection
                    code: session_compromised
                session_revoked:
                  summary: Session explicitly revoked
                  value:
                    error: session has been revoked
                    code: session_revoked
                session_expired:
                  summary: Session expired
                  value:
                    error: session has expired
                    code: session_expired
                invalid_token:
                  summary: Unknown or invalid refresh token
                  value:
                    error: invalid or expired refresh token
                    code: invalid_token
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/admin/users/{user_id}/sessions:
    get:
      summary: Admin List User Active Sessions
      operationId: adminListUserSessions
      tags:
      - Admin Session Management
      description: 'Admin endpoint to list all active sessions for a target user. Requires secret key or tenant admin access.

        '
      parameters:
      - name: user_id
        in: path
        required: true
        description: Target user ID whose sessions to list
        schema:
          type: string
      security:
      - SecretKey: []
      - BearerAuth: []
      responses:
        '200':
          description: Target user's active sessions
          content:
            application/json:
              schema:
                type: object
                required:
                - sessions
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden / Admin permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/admin/users/{user_id}/sessions/revoke-all:
    post:
      summary: Admin Revoke All Sessions for User
      operationId: adminRevokeAllUserSessions
      tags:
      - Admin Session Management
      description: 'Admin endpoint to forcibly revoke all active sessions for a target user. Requires secret key or tenant
        admin access.

        '
      parameters:
      - name: user_id
        in: path
        required: true
        description: Target user ID whose sessions to revoke
        schema:
          type: string
      security:
      - SecretKey: []
      - BearerAuth: []
      responses:
        '200':
          description: All sessions revoked for target user
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - user_id
                - count
                properties:
                  message:
                    type: string
                    example: all sessions revoked for user
                  user_id:
                    type: string
                    example: usr_01H1234567890ABCDEF
                  count:
                    type: integer
                    example: 3
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden / Admin permissions required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    PublishableKey:
      type: apiKey
      name: X-Authn-Publishable-Key
      in: header
      description: Client publishable key identifying application context
    SecretKey:
      type: apiKey
      name: X-Authn-Secret-Key
      in: header
      description: Backend secret key for tenant admin API calls
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Client user or console admin session JWT
  schemas:
    CreateKeyRequest:
      type: object
      required:
      - name
      - type
      properties:
        application_id:
          type: string
          example: app_00000000000000000000000000000001
          description: Owning application ID. Required for console JWT callers, optional for sk_ callers.
        name:
          type: string
          example: Production Stripe Webhook Key
          description: Operator-facing label for the key
        type:
          type: string
          enum:
          - publishable
          - secret
          example: publishable
          description: Scope of the key
        environment:
          type: string
          enum:
          - test
          - live
          example: test
          description: Mode environment matching the caller
        expires_in_days:
          type: integer
          example: 30
          description: Optional validity duration in days
    KeyDTO:
      type: object
      required:
      - id
      - application_id
      - name
      - type
      - key_prefix
      - environment
      - created_at
      properties:
        id:
          type: string
          example: key_1a2b3c
        application_id:
          type: string
          example: app_00000000000000000000000000000001
        name:
          type: string
          example: Production Key
        type:
          type: string
          example: publishable
        key_prefix:
          type: string
          example: pk_test_
        environment:
          type: string
          example: test
        created_at:
          type: string
          format: date-time
          example: '2026-08-01T12:00:00Z'
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-08-31T12:00:00Z'
        revoked_at:
          type: string
          format: date-time
          nullable: true
          example: null
    CreateKeyResponse:
      type: object
      required:
      - key
      - raw_key
      properties:
        key:
          $ref: '#/components/schemas/KeyDTO'
        raw_key:
          type: string
          example: pk_test_12345678901234567890123456789012
          description: Usable API key string; returned only once on creation
    RevokeKeyResponse:
      type: object
      required:
      - status
      - id
      properties:
        status:
          type: string
          example: revoked
        id:
          type: string
          example: key_1a2b3c
    ImpersonateRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          example: Investigating billing issue reported in support ticket
          description: Justification string (10 to 500 characters)
        duration_minutes:
          type: integer
          example: 15
          description: Requested session length in minutes (clamped to tenant policy max)
        ticket_id:
          type: string
          example: TICKET-10492
          description: Optional support ticket reference (3 to 100 characters)
        verification_method:
          type: string
          enum:
          - password
          - totp
          - webauthn
          - passkey
          example: password
          description: Step-up authentication method presented by the admin
        mfa_code:
          type: string
          example: '123456'
          description: TOTP 2FA verification code
        admin_password:
          type: string
          example: AdminSecretPassword123!
          description: Admin's own password for step-up verification
        credential_id:
          type: string
          example: cred_webauthn_99
          description: WebAuthn passkey credential identifier
    UserInfo:
      type: object
      required:
      - id
      - email
      - status
      - email_verified
      properties:
        id:
          type: string
          example: usr_1a2b3c
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          nullable: true
          example: Jane Doe
        status:
          type: string
          example: active
        email_verified:
          type: boolean
          example: true
    ImpersonationResult:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - impersonated_user
      - impersonator_id
      - session_id
      properties:
        access_token:
          type: string
          description: Impersonated JWT access token
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
          description: Token lifetime in seconds
        impersonated_user:
          $ref: '#/components/schemas/UserInfo'
        impersonator_id:
          type: string
          example: usr_admin_99
        session_id:
          type: string
          example: ses_imp_1750000000000000000
    ImpersonationPolicy:
      type: object
      required:
      - enabled
      - max_duration_minutes
      - require_step_up_auth
      - require_ticket_id
      - require_user_opt_in
      - email_notification_policy
      - read_only_default
      - restrict_admin_impersonation
      - allowed_roles
      properties:
        enabled:
          type: boolean
          example: true
        max_duration_minutes:
          type: integer
          minimum: 1
          maximum: 60
          example: 15
        require_step_up_auth:
          type: boolean
          example: true
        require_ticket_id:
          type: boolean
          example: false
        require_user_opt_in:
          type: boolean
          example: false
        email_notification_policy:
          type: string
          enum:
          - IMMEDIATE
          - POST_SESSION
          - DISABLED
          example: IMMEDIATE
        read_only_default:
          type: boolean
          example: false
        restrict_admin_impersonation:
          type: boolean
          example: true
        allowed_roles:
          type: array
          items:
            type: string
          example:
          - tenant_admin
          - support_admin
    ExitImpersonationResponse:
      type: object
      required:
      - message
      - impersonated_id
      - impersonator_id
      properties:
        message:
          type: string
          example: impersonation session exited successfully
        impersonated_id:
          type: string
          example: usr_target_123
        impersonator_id:
          type: string
          example: usr_admin_99
    PasswordPolicy:
      type: object
      required:
      - enforcement_mode
      - require_uppercase
      - require_lowercase
      - require_numeric
      - require_special
      - force_upgrade_on_signin
      - min_length
      - max_length
      properties:
        enforcement_mode:
          type: string
          enum:
          - require
          - notify
          example: require
        require_uppercase:
          type: boolean
          example: false
        require_lowercase:
          type: boolean
          example: false
        require_numeric:
          type: boolean
          example: true
        require_special:
          type: boolean
          example: false
        force_upgrade_on_signin:
          type: boolean
          example: false
        min_length:
          type: integer
          minimum: 8
          example: 8
        max_length:
          type: integer
          maximum: 4096
          example: 4096
    SecurityPolicy:
      type: object
      required:
      - require_email_verification
      - email_verification_mode
      - token_reuse_policy
      properties:
        require_email_verification:
          type: boolean
          example: false
        email_verification_mode:
          type: string
          enum:
          - hard
          - soft
          example: soft
        token_reuse_policy:
          type: string
          enum:
          - global_revoke
          - session_revoke
          example: global_revoke
    RecoveryPolicy:
      type: object
      required:
      - guardians_enabled
      - phone_otp_enabled
      - email_otp_enabled
      - old_password_enabled
      - security_questions_enabled
      - freeze_window_hours
      - claim_token_ttl_minutes
      - lockout_schedule
      - lockout_reset_days
      - trusted_device_window_days
      - min_guardians
      - max_guardians
      - ipv4_subnet_bits
      - ipv6_subnet_bits
      - max_proof_attempts_per_window
      properties:
        guardians_enabled:
          type: boolean
          example: true
        phone_otp_enabled:
          type: boolean
          example: true
        email_otp_enabled:
          type: boolean
          example: true
        old_password_enabled:
          type: boolean
          example: true
        security_questions_enabled:
          type: boolean
          example: true
        freeze_window_hours:
          type: integer
          minimum: 24
          maximum: 168
          example: 48
        claim_token_ttl_minutes:
          type: integer
          minimum: 5
          maximum: 60
          example: 15
        lockout_schedule:
          type: array
          items:
            type: string
          example:
          - 24h
          - 3d
          - 7d
          - 14d
          - 4w
          - 8w
          - 12w
          - permanent
        lockout_reset_days:
          type: integer
          minimum: 7
          maximum: 90
          example: 30
        trusted_device_window_days:
          type: integer
          minimum: 30
          maximum: 365
          example: 90
        min_guardians:
          type: integer
          minimum: 1
          example: 1
        max_guardians:
          type: integer
          maximum: 5
          example: 5
        ipv4_subnet_bits:
          type: integer
          minimum: 16
          maximum: 30
          example: 24
        ipv6_subnet_bits:
          type: integer
          minimum: 32
          maximum: 64
          example: 48
        max_proof_attempts_per_window:
          type: integer
          minimum: 1
          maximum: 10
          example: 3
    CreateRoleRequest:
      type: object
      required:
      - name
      properties:
        tenant_id:
          type: string
          example: tnt_1a2b3c
          description: Optional target tenant ID
        name:
          type: string
          example: Support Agent
        slug:
          type: string
          example: support_agent
        description:
          type: string
          example: Customer support team role with limited administrative scope
        permissions:
          type: array
          items:
            type: string
          example:
          - users:read
          - users:impersonate
    Role:
      type: object
      required:
      - id
      - tenant_id
      - name
      - slug
      - is_system_role
      - created_at
      - updated_at
      properties:
        id:
          type: string
          example: rol_1a2b3c
        tenant_id:
          type: string
          example: tnt_1a2b3c
        name:
          type: string
          example: Support Agent
        slug:
          type: string
          example: support_agent
        description:
          type: string
          example: Support team role
        is_system_role:
          type: boolean
          example: false
        created_by_user_id:
          type: string
          nullable: true
          example: usr_admin_1
        updated_by_user_id:
          type: string
          nullable: true
          example: usr_admin_1
        created_at:
          type: string
          format: date-time
          example: '2026-08-01T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-08-01T12:00:00Z'
    RoleListResponse:
      type: object
      required:
      - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    UpdateRolePermissionsRequest:
      type: object
      required:
      - permissions
      properties:
        permissions:
          type: array
          items:
            type: string
          example:
          - users:read
          - users:impersonate
          - audit:read
    UpdateRolePermissionsResponse:
      type: object
      required:
      - message
      - role_id
      properties:
        message:
          type: string
          example: permissions updated successfully
        role_id:
          type: string
          example: rol_1a2b3c
    AssignUserRoleRequest:
      type: object
      properties:
        role_slug:
          type: string
          example: support_agent
          description: Role slug identifier to assign
        role:
          type: string
          example: support_agent
          description: Fallback role slug parameter
    AssignUserRoleResponse:
      type: object
      required:
      - message
      - user_id
      - role
      properties:
        message:
          type: string
          example: role assigned to user successfully
        user_id:
