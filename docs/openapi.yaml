    get:
      summary: Verify User Email Address
      description: Validates an email verification token received via email link and marks the user's email address as verified.
      operationId: clientVerifyEmail
      tags:
      - Authentication
      security:
      - PublishableKey: []
      parameters:
      - in: query
        name: token
        required: true
        schema:
          type: string
        description: Verification token passed in the query string from the emailed link.
      - in: query
        name: publishable_key
        required: false
        schema:
          type: string
        description: Query string fallback for X-Authn-Publishable-Key header on top-level browser navigation.
      - in: query
        name: pk
        required: false
        schema:
          type: string
        description: Shortened query string fallback for X-Authn-Publishable-Key header.
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: email successfully verified
                  email:
                    type: string
                    example: user@example.com
                  email_verified:
                    type: boolean
                    example: true
                required:
                - message
                - email
                - email_verified
        '400':
          description: Missing token parameter or invalid/expired verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid publishable API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Request throttled due to rate limiting
          content:
