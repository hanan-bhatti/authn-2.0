  /v1/oauth/authorize:
    get:
      summary: OAuth2 PKCE Authorization Endpoint
      description: 'Requires an authenticated user session (via access token cookie or Authorization Bearer header) and a
        valid publishable key.

        Validates client registration and redirect URI, then issues a single-use PKCE authorization code.

        Returns a 302 redirect to the redirect_uri when supplied, or 200 OK with code in JSON body otherwise.

        '
      operationId: oauthAuthorize
      tags:
      - OAuth & OIDC
      security:
      - PublishableKey: []
      - BearerAuth: []
      parameters:
      - in: query
        name: client_id
        required: true
        schema:
          type: string
        description: Registered client application identifier.
      - in: query
        name: redirect_uri
        required: false
        schema:
          type: string
        description: Callback destination URI. Must exactly match one of client's registered exact_redirect_uris.
      - in: query
        name: response_type
        required: false
        schema:
          type: string
          default: code
        description: Response type (only "code" is supported).
      - in: query
        name: code_challenge
        required: false
        schema:
          type: string
        description: PKCE code challenge derived from the client's code verifier.
      - in: query
        name: code_challenge_method
        required: false
        schema:
          type: string
          default: S256
        description: PKCE transform method ("S256" required; "plain" is rejected with 400).
      - in: query
        name: scope
        required: false
        schema:
          type: string
          default: openid profile email
        description: Requested OAuth2 scopes.
      - in: query
        name: state
        required: false
        schema:
          type: string
        description: Opaque state parameter echoed back in the redirect query parameters.
      - in: query
        name: publishable_key
        required: false
        schema:
          type: string
        description: Query parameter fallback for publishable key if X-Authn-Publishable-Key header is absent.
      - in: query
        name: pk
        required: false
        schema:
          type: string
        description: Short alias query parameter fallback for publishable key.
      responses:
        '302':
          description: Found - Redirects to redirect_uri with code and state parameters
          headers:
            Location:
              schema:
                type: string
              description: Redirect URL containing code and optional state query parameters
        '200':
          description: Authorization code issued (returned in body when redirect_uri is omitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        '400':
          description: Bad Request - Missing/invalid parameters, plain PKCE method, or unregistered client/redirect URI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: 'invalid_request: client_id is not registered or redirect_uri is not authorized for this client'
                code: validation_failed
        '401':
          description: Unauthorized - Authentication session required or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: 'unauthorized: authentication session required'
                code: unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/oauth/token:
    post:
      summary: OAuth2 Token Exchange & Refresh Endpoint
      description: 'Exchanges an authorization code for access and ID tokens (authorization_code grant with PKCE),

        or exchanges a refresh token for rotated tokens (refresh_token grant).

        Payload is accepted as JSON or form URL-encoded.

        '
      operationId: oauthTokenExchange
      tags:
      - OAuth & OIDC
      security:
      - PublishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          description: Token exchange successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Sets HttpOnly authn_refresh_token cookie when rotating refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenExchangeResponse'
        '400':
          description: Bad Request - Missing code/refresh_token, malformed body, or invalid grant parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: 'invalid_grant: authorization code, client_id, redirect_uri, or PKCE code_verifier is invalid or expired'
                code: validation_failed
        '401':
          description: Unauthorized - Refresh token is invalid, expired, or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: refresh token is invalid, expired, or has been revoked
                code: invalid_token
  /v1/admin/jwks/rotate:
