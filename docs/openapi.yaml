      security:
      - SecretKey: []
      - BearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Unique webhook endpoint ID
      responses:
        '200':
          description: Signing secret rotated successfully; response includes raw secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointResponse'
        '401':
          description: Missing or invalid secret key or admin console token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Code `live_key_required`. Rotation invalidates the signature every live
            receiver verifies, so it requires a live secret key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Webhook endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
