  /v1/client/auth/recovery/cancel:
    post:
      summary: Cancel recovery (authenticated session)
      description: Cancels an active recovery request using an authenticated user session, blacklisting the originating request
        details for 7 days.
      operationId: CancelRecoveryAuth
      security:
      - PublishableKey: []
        BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - recovery_request_id
              properties:
                recovery_request_id:
                  type: string
                  example: req_1a2b3c
                  description: Recovery request ID to cancel
      responses:
        '200':
          description: Recovery request cancelled successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - message
                properties:
                  status:
                    type: string
                    example: cancelled
                  message:
                    type: string
                    example: Recovery request successfully cancelled. Originating request details blacklisted for 7 days.
                      Account flagged for security review.
        '400':
          description: Bad request (missing parameter or invalid cancellation point)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized (missing or invalid session token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
